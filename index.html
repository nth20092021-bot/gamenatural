    .hidden { display: none !important; }
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      margin: 0;
      padding: 0;

      overflow: hidden;

      font-family: 'Inter', system-ui, sans-serif;

    }

      inset: 0;

      height: 100%;
      z-index: 1;
      cursor: grab;
    }
    #canvas-container:active {
      cursor: grabbing;
    }
    /* Roblox-style glossy button */

    .rbx-btn:hover:not(:disabled) {

      box-shadow: 0 0 18px rgba(250, 204, 21, 0.55);
      transform: translateY(-2px);
    }

      0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      50% { transform: scale(1.06); box-shadow: 0 0 24px 6px rgba(239, 68, 68, 0.45); }
    }

      animation: pulse-danger 0.9s infinite ease-in-out;
    }

      0% { transform: scale(0.5); opacity: 0; }
      75% { transform: scale(1.06); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }

    }

  <script>
    // =========================================================================
    // 1. AUDIO SYNTHESIZER (Web Audio API - Zero external files)
    // =========================================================================
    function drawRoundedRectPath(ctx, x, y, w, h, r) {
      const rad = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + rad, y);
      ctx.lineTo(x + w - rad, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + rad);
      ctx.lineTo(x + w, y + h - rad);
      ctx.quadraticCurveTo(x + w, y + h, x + w - rad, y + h);
      ctx.lineTo(x + rad, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - rad);
      ctx.lineTo(x, y + rad);
      ctx.quadraticCurveTo(x, y, x + rad, y);
      ctx.closePath();
    }

    const SFX = {
      ctx: null,
      muted: false,
      init() {
        try {
          if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) this.ctx = new AudioCtx();
          }
          if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume().catch(() => {});
          }
        } catch (e) {}
      },
      playClick() {
        try {
          if (this.muted) return;
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(520, now);
          osc.frequency.exponentialRampToValueAtTime(780, now + 0.06);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.07);
        } catch (e) {}
      },
      playSiren() {
        try {
          if (this.muted) return;
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(420, now);
          osc.frequency.linearRampToValueAtTime(760, now + 0.35);
          osc.frequency.linearRampToValueAtTime(420, now + 0.7);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.72);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.72);
        } catch (e) {}
      },
      playBoom(intensity = 1) {
        try {
          if (this.muted) return;
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const bufferSize = Math.floor(this.ctx.sampleRate * 0.38);
          const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (this.ctx.sampleRate * 0.11));
          }
          const noise = this.ctx.createBufferSource();
          noise.buffer = buffer;

          const filter = this.ctx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(680 * intensity, now);

          const gain = this.ctx.createGain();
          gain.gain.setValueAtTime(0.24 * intensity, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.36);

          noise.connect(filter);
          filter.connect(gain);
          gain.connect(this.ctx.destination);
          noise.start(now);
        } catch (e) {}
      },
      playOof() {
        try {
          if (this.muted) return;
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(310, now);
          osc.frequency.exponentialRampToValueAtTime(140, now + 0.14);
          gain.gain.setValueAtTime(0.11, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.15);
        } catch (e) {}
      },
      playPanic() {
        try {
          if (this.muted) return;
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(580, now);
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.08);
          osc.frequency.exponentialRampToValueAtTime(480, now + 0.18);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.19);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.19);
        } catch (e) {}
      },
      playVictory() {
        try {
          if (this.muted) return;
          this.init();
          if (!this.ctx) return;
          const notes = [523.25, 659.25, 783.99, 1046.5];
          notes.forEach((freq, idx) => {
            const now = this.ctx.currentTime + idx * 0.11;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now);
            gain.gain.setValueAtTime(0.18, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now);
            osc.stop(now + 0.45);
          });
        } catch (e) {}
      }
    };

    // =========================================================================
    // 2. GAME STATE & 38 STUDENTS DATA
    // =========================================================================
    const TOTAL_PLAYERS = 38;
    const GRAVITY = -38.0;
    const ISLAND_RADIUS = 142.0; // Mega-scale sunset island radius (45+ shelters)!
    const playersData = [];
    for (let i = 1; i <= TOTAL_PLAYERS; i++) {
      playersData.push({
        id: i,
        numStr: String(i).padStart(2, '0'),
        name: `#${String(i).padStart(2, '0')}`,
        gender: i % 2 === 1 ? 'M' : 'F',
        hairStyle: (i - 1) % 3,
        excluded: false
      });
    }

    const STATE = {
      IDLE: 'IDLE',
      HIDING: 'HIDING',
      WARNING: 'WARNING',

          vec4 wp = modelMatrix * vec4(position, 1.0);
          vWorldPos = wp.xyz;

      fragmentShader: `
        uniform float uTime;
        uniform vec3 uTopColor;
        uniform vec3 uMidColor;
        uniform vec3 uHorizonColor;
        uniform vec3 uSunDir;
        uniform float uStorminess;
        varying vec3 vWorldPos;

        float hash(vec2 p) {
          return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
        }
        float noise(vec2 p) {
          vec2 i = floor(p);
          vec2 f = fract(p);
          f = f * f * (3.0 - 2.0 * f);
          return mix(
            mix(hash(i + vec2(0.0, 0.0)), hash(i + vec2(1.0, 0.0)), f.x),
            mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x),
            f.y
          );
        }
        float fbm(vec2 p) {
          float v = 0.0;
          float a = 0.5;
          for (int i = 0; i < 4; i++) {
            v += a * noise(p);
            p = p * 2.02 + vec2(13.7, 29.3);
            a *= 0.5;
          }
          return v;
        }

        void main() {
          vec3 dir = normalize(vWorldPos);
          float h = clamp(dir.y, 0.0, 1.0);

          // Crisp Anime Morning 4-Stop Sky Gradient (Warm Morning Mist Horizon -> Sky-Blue Mid -> Cobalt Zenith)
          vec3 morningHorizon = mix(uHorizonColor, vec3(0.84, 0.95, 1.0), 0.36 * (1.0 - uStorminess));
          vec3 lowerGrad = mix(morningHorizon, uMidColor, smoothstep(0.0, 0.28, h));
          vec3 col = mix(lowerGrad, uTopColor, smoothstep(0.24, 0.86, h));

          // Soft Golden-White Morning Horizon Glow
          float horizonGlow = pow(max(1.0 - h, 0.0001), 4.5);
          col += vec3(1.0, 0.94, 0.76) * horizonGlow * 0.20 * (1.0 - uStorminess * 0.85);

          // Radiant Morning Sun Disc, Golden-White Corona & Morning Rayleigh Halo
          float sunAmt = max(dot(dir, uSunDir), 0.0001);
          col += vec3(1.0, 0.90, 0.65) * pow(sunAmt, 5.0) * 0.26 * (1.0 - uStorminess * 0.80);
          col += vec3(1.0, 0.96, 0.84) * pow(sunAmt, 22.0) * 0.42 * (1.0 - uStorminess * 0.85);
          col += vec3(1.0, 0.99, 0.94) * smoothstep(0.9935, 0.9986, sunAmt) * 0.88 * (1.0 - uStorminess * 0.90);

          // Fluffy Sunlit Anime Morning Cumulus Clouds (Soft Sky-Blue Undersides + Snow-White Tops + Golden Silver Lining)
          if (dir.y > 0.02) {
            vec2 uv = dir.xz / (dir.y + 0.25) * 1.08 + vec2(uTime * 0.010, uTime * 0.004);
            float c1 = fbm(uv * 2.0);
            float c2 = fbm(uv * 4.0 + vec2(2.7, -1.8));
            float cloudMask = smoothstep(0.46 - uStorminess * 0.18, 0.76, c1) * smoothstep(0.02, 0.18, dir.y);

            vec3 cloudShadowCol = vec3(0.68, 0.81, 0.94);
            vec3 cloudBrightBody = vec3(0.97, 0.99, 1.0);
            vec3 cloudSunRim = mix(vec3(1.0, 0.98, 0.92), vec3(1.0, 0.94, 0.78), pow(sunAmt, 2.0));

            float lightFactor = clamp(c2 * 0.88 + pow(sunAmt, 2.5) * 0.32, 0.0, 1.0);
            vec3 morningCloudCol = mix(cloudShadowCol, cloudBrightBody, smoothstep(0.20, 0.56, lightFactor));
            morningCloudCol = mix(morningCloudCol, cloudSunRim, smoothstep(0.58, 0.86, lightFactor));

            vec3 stormCloudCol = mix(uTopColor * 0.55, uHorizonColor * 0.38, c2);
            vec3 finalCloudCol = mix(morningCloudCol, stormCloudCol, uStorminess);

            col = mix(col, finalCloudCol, cloudMask * 0.86);
          }

          gl_FragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
        }
      `

        varying vec3 vWorldPos;

        varying float vWaveHeight;
        void main() {
          vec3 p = position;
          float w1 = sin(p.x * 0.055 + uTime * 1.7) * cos(p.z * 0.055 + uTime * 1.4) * 0.46;
          float w2 = sin((p.x * 0.75 + p.z * 0.65) * 0.11 - uTime * 2.1) * 0.20;

          float dz = -sin(p.z * 0.055 + uTime * 1.4) * 0.035;
          vNormal = normalize(vec3(-dx, 1.0, -dz));

          vec4 wp = modelMatrix * vec4(p, 1.0);
          vWorldPos = wp.xyz;
          gl_Position = projectionMatrix * viewMatrix * wp;
        }
      `,
      fragmentShader: `
        uniform float uTime;
        uniform float uIslandRadius;
        uniform vec3 uCameraPos;
        uniform vec3 uSunDir;
        uniform vec3 uDeepColor;
        uniform vec3 uShallowColor;
        uniform vec3 uSkyReflectColor;
        uniform vec3 uFoamColor;
        uniform vec3 uFogColor;
        varying vec3 vWorldPos;
        varying vec3 vNormal;
        varying float vWaveHeight;

        float hash(vec2 p) {
          return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
        }
        float noise(vec2 p) {
          vec2 i = floor(p);
          vec2 f = fract(p);
          f = f * f * (3.0 - 2.0 * f);
          return mix(
            mix(hash(i + vec2(0.0, 0.0)), hash(i + vec2(1.0, 0.0)), f.x),
            mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x),
            f.y
          );
        }
        float fbm3(vec2 p) {
          float v = 0.5 * noise(p);
          p = p * 2.03 + vec2(7.3, 19.1);
          v += 0.25 * noise(p);
          p = p * 2.03 + vec2(11.7, 5.3);
          v += 0.125 * noise(p);

        void main() {

          vec3 N = normalize(vNormal + vec3((ripple - 0.5) * 0.22, 0.0, (ripple - 0.5) * 0.22));
          vec3 V = normalize(uCameraPos - vWorldPos);

          // Coastal Depth Gradient (Shallow Turquoise Lagoon -> Deep Morning Azure Sea)

          vec3 waterCol = mix(uDeepColor, uShallowColor, pow(max(shallowFactor, 0.0001), 1.2));

          // 3D Wave Trough Shadows
          float troughShadow = mix(0.66, 1.08, smoothstep(-0.50, 0.50, vWaveHeight + (ripple - 0.5) * 0.42));
          waterCol *= troughShadow;

          // Subsurface Wave Crest Scattering toward the Morning Sun
          float sss = clamp(dot(V, -uSunDir), 0.0, 1.0) * smoothstep(0.08, 0.52, vWaveHeight);
          waterCol += vec3(0.06, 0.38, 0.44) * sss * 0.42;

          // Fresnel Morning Sky Reflection
          float fnv = max(1.0 - max(dot(N, V), 0.0), 0.0); float fresnel = fnv * fnv * fnv;
          waterCol = mix(waterCol, uSkyReflectColor, clamp(fresnel * 0.54, 0.0, 0.60));

          // Sunlit Ripple Crest Highlights
          float crestHighlight = smoothstep(0.65, 0.78, ripple) * (0.15 + shallowFactor * 0.13);
          waterCol = mix(waterCol, uSkyReflectColor * 1.25, crestHighlight);

          // Sparkling Morning Sun Specular Glints
          vec3 H = normalize(uSunDir + V);
          float ndoth = max(dot(N, H), 0.0001);
          float specGlint = pow(ndoth, 82.0) * 0.72 + pow(ndoth, 18.0) * 0.16;
          waterCol += vec3(1.0, 0.96, 0.82) * specGlint;

          float shoreDist = abs(dist - uIslandRadius);
          float surfWave = sin(shoreDist * 1.75 - uTime * 3.1 + ripple * 3.8) * 0.5 + 0.5;
          float shoreEnvelope = 1.0 - smoothstep(0.0, 8.5, shoreDist);
          float shoreFoam = shoreEnvelope * smoothstep(0.54, 0.66, surfWave + shoreEnvelope * 0.22) * 0.80;

          finalCol = mix(finalCol, uFogColor, horizonBlend * 0.82);

          gl_FragColor = vec4(clamp(finalCol, 0.0, 1.0), 0.96);
        }
      `

      entry.stamped = true;
      const { ctx, bumpCtx, baseCol, isPureGrass, grassVariant, mapTex, bumpTex } = entry;

      // Draw the exact user-uploaded cartoon grass texture image!
      ctx.save();
      ctx.drawImage(userGrassImg, 0, 0, 512, 512);

      if (!isPureGrass) {
        // Tint non-green variants (such as sakura pink or autumn maple foliage) while preserving the grass tuft art
        ctx.globalCompositeOperation = 'color';
        ctx.fillStyle = `#${baseCol.getHexString()}`;
        ctx.fillRect(0, 0, 512, 512);
        ctx.globalCompositeOperation = 'multiply';
        ctx.fillStyle = `#${baseCol.clone().offsetHSL(0, 0, 0.22).getHexString()}`;

        bumpCtx.drawImage(userGrassImg, 0, 0, 512, 512);

    // Fallback/Immediate Synchronous Cartoon Grass Tuft Painter (matches user's uploaded image style)
    function drawStylizedGrassTuftPattern(ctx, bumpCtx, baseCol, isPureGrass) {
      const grassBase = isPureGrass ? new THREE.Color(0x6da107) : baseCol.clone();
      const shadowOvalCol = isPureGrass ? new THREE.Color(0x527d04) : baseCol.clone().offsetHSL(0, 0.04, -0.12);
      const bladeBodyCol = isPureGrass ? new THREE.Color(0x74ab09) : baseCol.clone().offsetHSL(0, 0.02, 0.03);
      const bladeRimCol = isPureGrass ? new THREE.Color(0x9fd121) : baseCol.clone().offsetHSL(0.02, 0.08, 0.16);
      const bladeShadowCol = isPureGrass ? new THREE.Color(0x416603) : baseCol.clone().offsetHSL(-0.01, 0.05, -0.18);

      ctx.fillStyle = `#${grassBase.getHexString()}`;
      ctx.fillRect(0, 0, 512, 512);

      if (bumpCtx) {
        bumpCtx.fillStyle = '#707070';
        bumpCtx.fillRect(0, 0, 512, 512);
      }

      // Dark olive horizontal oval ground shadow patches (like in the uploaded image)
      for (let i = 0; i < 34; i++) {
        const ox = ((i * 139 + 24) % 480) + 16;
        const oy = ((i * 197 + 38) % 480) + 16;
        const rx = 24 + (i % 4) * 14;
        const ry = 8 + (i % 3) * 5;
        ctx.fillStyle = `#${shadowOvalCol.getHexString()}`;
        ctx.beginPath();
        ctx.ellipse(ox, oy, rx, ry, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      // Stylized fan-shaped jagged leaf tufts with dark drop shadow & yellow-green highlight rim
      for (let t = 0; t < 38; t++) {
        const tx = ((t * 113 + 35) % 468) + 22;
        const ty = ((t * 163 + 42) % 468) + 22;
        const scale = 0.82 + (t % 3) * 0.22;
        const blades = 5;

        // Base oval shadow under the tuft
        ctx.fillStyle = `#${bladeShadowCol.getHexString()}`;
        ctx.beginPath();
        ctx.ellipse(tx, ty + 6 * scale, 22 * scale, 7 * scale, 0, 0, Math.PI * 2);
        ctx.fill();

        for (let b = 0; b < blades; b++) {
          const frac = (b / (blades - 1)) - 0.5;
          const ang = frac * 1.45 + ((t % 2 === 0 ? 1 : -1) * 0.12);
          const len = (26 + (b % 2) * 8) * scale;
          const tipX = tx + Math.sin(ang) * len;
          const tipY = ty - Math.cos(ang) * len;

          // Dark drop shadow edge
          ctx.fillStyle = `#${bladeShadowCol.getHexString()}`;
          ctx.beginPath();
          ctx.moveTo(tx - 6 * scale, ty + 3 * scale);
          ctx.quadraticCurveTo(tx + Math.sin(ang) * len * 0.55 - 5 * scale, ty - Math.cos(ang) * len * 0.55, tipX + 2, tipY + 3);
          ctx.quadraticCurveTo(tx + Math.sin(ang) * len * 0.55 + 7 * scale, ty - Math.cos(ang) * len * 0.55, tx + 7 * scale, ty + 3 * scale);
          ctx.closePath();
          ctx.fill();

          // Bright rim highlight + blade body
          ctx.fillStyle = `#${bladeBodyCol.getHexString()}`;
          ctx.strokeStyle = `#${bladeRimCol.getHexString()}`;
          ctx.lineWidth = 2.4 * scale;
          ctx.beginPath();
          ctx.moveTo(tx - 5 * scale, ty);
          ctx.quadraticCurveTo(tx + Math.sin(ang) * len * 0.5 - 4 * scale, ty - Math.cos(ang) * len * 0.5, tipX, tipY);
          ctx.quadraticCurveTo(tx + Math.sin(ang) * len * 0.5 + 5 * scale, ty - Math.cos(ang) * len * 0.5, tx + 5 * scale, ty);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();

          if (bumpCtx) {
            bumpCtx.fillStyle = '#c8c8c8';
            bumpCtx.strokeStyle = '#ffffff';
            bumpCtx.lineWidth = 2.0;
            bumpCtx.fill();
            bumpCtx.stroke();
          }
        }
      }
    }

    // Custom 3D Shadow-Rich Shader Hook (Zero NaN, Zero dFdx/dFdy flicker, Pre-Tonemapping)
    function applyShadowRichShader(mat, type = 'default') {
      mat.onBeforeCompile = (shader) => {
        shader.uniforms.uShadowTint = mapShaderUniforms.uShadowTint;
        shader.uniforms.uLitTint = mapShaderUniforms.uLitTint;
        shader.uniforms.uRimColor = mapShaderUniforms.uRimColor;
        shader.uniforms.uMapSunDir = mapShaderUniforms.uMapSunDir;

        shader.vertexShader = shader.vertexShader.replace(
          '#include <common>',
          `#include <common>
           varying vec3 vCustomWorldPos;
           varying vec3 vCustomWorldNormal;`
        );
        shader.vertexShader = shader.vertexShader.replace(
          '#include <worldpos_vertex>',
          `#include <worldpos_vertex>
           vec4 customWp = modelMatrix * vec4(transformed, 1.0);
           vCustomWorldPos = customWp.xyz;
           vec3 rawWorldN = mat3(modelMatrix) * objectNormal;
           float rawLen = max(length(rawWorldN), 0.0001);
           vCustomWorldNormal = rawWorldN / rawLen;`
        );

        shader.fragmentShader = shader.fragmentShader.replace(
          '#include <common>',
          `#include <common>
           uniform vec3 uShadowTint;
           uniform vec3 uLitTint;
           uniform vec3 uRimColor;
           uniform vec3 uMapSunDir;
           varying vec3 vCustomWorldPos;
           varying vec3 vCustomWorldNormal;`
        );
        shader.fragmentShader = shader.fragmentShader.replace(
          '#include <tonemapping_fragment>',
          `
           // 1. Safe Normalized World Normal (never NaN even on degenerate or grazing triangles)
           float nLen = max(length(vCustomWorldNormal), 0.0001);
           vec3 N = vCustomWorldNormal / nLen;
           float ndotl = dot(N, uMapSunDir);
           float shadowRamp = smoothstep(-0.32, 0.42, ndotl);
           gl_FragColor.rgb *= mix(uShadowTint, uLitTint, shadowRamp);

           // 2. Subtle Anime Sun-Facing Upper Rim Highlight on Roofs & Walls
           float upFacing = clamp(N.y, 0.0, 1.0) * smoothstep(0.15, 0.65, ndotl);
           gl_FragColor.rgb += uRimColor * upFacing * 0.038;

           // 3. Vertical Ground Contact Ambient Occlusion
           float heightAO = smoothstep(-0.6, 2.6, vCustomWorldPos.y);
           gl_FragColor.rgb *= mix(0.86, 1.0, heightAO);

           gl_FragColor.rgb = max(gl_FragColor.rgb, vec3(0.0));
           #include <tonemapping_fragment>
          `
        );
      };
      return mat;
    }

    const textureCache = {};
    const materialCache = {};

    function getProceduralTextures(type, baseHex, detailHex, repeatX = 2, repeatY = 2) {
      const key = `anime_tex_v3_${type}_${baseHex}_${detailHex}_${repeatX}_${repeatY}`;
      if (textureCache[key]) return textureCache[key];

      const c = document.createElement('canvas');

      const baseCol = new THREE.Color(baseHex);

      const mapTex = new THREE.CanvasTexture(c);
      mapTex.wrapS = THREE.RepeatWrapping;
      mapTex.wrapT = THREE.RepeatWrapping;
      mapTex.repeat.set(repeatX, repeatY);
      mapTex.anisotropy = maxAnisotropy;

      const bumpTex = new THREE.CanvasTexture(bumpCanvas);
      bumpTex.wrapS = THREE.RepeatWrapping;

        for (let hx = -40; hx < 540; hx += 48) {

        const sGrad = ctx.createLinearGradient(0, 0, 512, 512);
        sGrad.addColorStop(0, `#${baseCol.getHexString()}`);
        sGrad.addColorStop(1, `#${darkCol.getHexString()}`);
        ctx.fillStyle = sGrad;
        ctx.fillRect(0, 0, 512, 512);

        ctx.lineWidth = 6;
        ctx.lineCap = 'round';
        for (let w = 0; w < 10; w++) {
          const wy = w * 52 + 24;
          ctx.strokeStyle = w % 2 === 0 ? 'rgba(255, 240, 200, 0.18)' : 'rgba(120, 53, 15, 0.20)';
          ctx.beginPath();
          for (let x = 0; x <= 512; x += 32) {
            const y = wy + Math.sin(x * 0.025 + w) * 10;
            if (x === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          }
          ctx.stroke();
        }

      } else if (type === 'rock') {
        // ⛰️ DEEP SHADOW-FACETED ANIME CLIFF ROCK
        ctx.fillStyle = `#${darkCol.getHexString()}`;
        ctx.fillRect(0, 0, 512, 512);

        for (let i = 0; i < 26; i++) {
          const rx = ((i * 131) % 440) + 10;
          const ry = ((i * 89) % 440) + 10;
          const rw = 70 + (i % 3) * 35;
          const rh = 55 + (i % 4) * 28;
          const facetCol = i % 3 === 0 ? baseCol : (i % 3 === 1 ? darkCol : lightCol);
          ctx.fillStyle = `#${facetCol.getHexString()}`;
          drawRoundedRectPath(ctx, rx, ry, rw, rh, 12);
          ctx.fill();

          ctx.strokeStyle = 'rgba(2, 6, 23, 0.42)';
          ctx.lineWidth = 4;
          ctx.stroke();

          bumpCtx.fillStyle = i % 2 === 0 ? '#b8b8b8' : '#484848';
          drawRoundedRectPath(bumpCtx, rx, ry, rw, rh, 12);
          bumpCtx.fill();
        }

      } else if (type === 'concrete' || type === 'asphalt') {
        // 🛤️ DUSK-SHADED FLAGSTONE PLAZA & ASPHALT ROAD
        const rGrad = ctx.createLinearGradient(0, 0, 512, 512);
        rGrad.addColorStop(0, `#${baseCol.getHexString()}`);
        rGrad.addColorStop(1, `#${darkCol.getHexString()}`);
        ctx.fillStyle = rGrad;
        ctx.fillRect(0, 0, 512, 512);

        if (type === 'concrete') {
          const stones = [
            [14, 14, 228, 228], [268, 14, 228, 228],
            [14, 268, 228, 228], [268, 268, 228, 228]
          ];
          stones.forEach(([sx, sy, sw, sh], idx) => {
            const tileCol = baseCol.clone().offsetHSL(0, 0, (idx % 2 === 0 ? -0.04 : -0.09));
            ctx.fillStyle = `#${tileCol.getHexString()}`;
            drawRoundedRectPath(ctx, sx, sy, sw, sh, 20);
            ctx.fill();
            ctx.strokeStyle = 'rgba(15, 23, 42, 0.35)';
            ctx.lineWidth = 5;
            ctx.stroke();
          });
        } else {
          ctx.fillStyle = 'rgba(2, 6, 23, 0.18)';
          ctx.fillRect(36, 0, 440, 512);
        }

      } else if (type === 'wood') {
        // 🪵 RICH SHADOWED WOODEN PLANKS
        const planks = 5;
        const ph = 512 / planks;
        for (let p = 0; p < planks; p++) {
          const py = p * ph;
          const pCol = baseCol.clone().offsetHSL(0, 0, (p % 2 === 0 ? 0.02 : -0.07));
          ctx.fillStyle = `#${pCol.getHexString()}`;
          ctx.fillRect(0, py, 512, ph - 5);
          ctx.fillStyle = 'rgba(20, 8, 2, 0.48)';
          ctx.fillRect(0, py + ph - 5, 512, 5);
        }
      } else if (type === 'meteor') {
        // ☄️ HIGH-DETAIL ANIME VOLCANIC ASTEROID & MOLTEN MAGMA VEINS TEXTURE
        // 1. Deep Charred Obsidian & Basalt Rock Crust Base
        const rockGrad = ctx.createRadialGradient(256, 256, 30, 256, 256, 360);
        rockGrad.addColorStop(0, '#29201e');
        rockGrad.addColorStop(0.55, '#1c1614');
        rockGrad.addColorStop(1, '#0f0b0a');
        ctx.fillStyle = rockGrad;
        ctx.fillRect(0, 0, 512, 512);

        bumpCtx.fillStyle = '#c8c8c8';
        bumpCtx.fillRect(0, 0, 512, 512);

        // 2. Sculpted Craggy Basalt Tectonic Plates & Charcoal Facets
        for (let i = 0; i < 42; i++) {
          const px = (i * 127 + 23) % 480;
          const py = (i * 89 + 41) % 480;
          const pw = 46 + (i % 4) * 26;
          const ph = 38 + (i % 3) * 22;

          ctx.fillStyle = i % 3 === 0 ? '#332926' : (i % 3 === 1 ? '#211a18' : '#161110');
          drawRoundedRectPath(ctx, px, py, pw, ph, 14);
          ctx.fill();

          // Subtle ash-grey mineral highlight on plate edges
          ctx.strokeStyle = 'rgba(168, 162, 158, 0.18)';
          ctx.lineWidth = 2.5;
          ctx.stroke();

          bumpCtx.fillStyle = i % 2 === 0 ? '#ffffff' : '#9a9a9a';
          drawRoundedRectPath(bumpCtx, px, py, pw, ph, 12);
          bumpCtx.fill();
        }

        // 3. Deep Asteroid Impact Craters with Raised Charred Rims & Glowing Magma Pools
        for (let cIdx = 0; cIdx < 16; cIdx++) {
          const cx = ((cIdx * 157 + 48) % 432) + 40;
          const cy = ((cIdx * 193 + 60) % 432) + 40;
          const cr = 18 + (cIdx % 4) * 10;

          // Raised rocky crater rim
          ctx.fillStyle = '#3f322e';
          ctx.beginPath();
          ctx.arc(cx, cy, cr * 1.22, 0, Math.PI * 2);
          ctx.fill();

          // Dark recessed crater pit
          ctx.fillStyle = '#090606';
          ctx.beginPath();
          ctx.arc(cx, cy, cr * 0.92, 0, Math.PI * 2);
          ctx.fill();

          // Glowing molten magma pool inside crater heart
          const poolGrad = ctx.createRadialGradient(cx, cy, 1, cx, cy, cr * 0.78);
          poolGrad.addColorStop(0, '#fef08a');
          poolGrad.addColorStop(0.42, '#f97316');
          poolGrad.addColorStop(0.82, '#dc2626');
          poolGrad.addColorStop(1, 'rgba(127, 29, 29, 0)');
          ctx.fillStyle = poolGrad;
          ctx.beginPath();
          ctx.arc(cx, cy, cr * 0.78, 0, Math.PI * 2);
          ctx.fill();

          // Bump map: bright raised rim + dark recessed pit
          bumpCtx.strokeStyle = '#ffffff';
          bumpCtx.lineWidth = 6;
          bumpCtx.beginPath();
          bumpCtx.arc(cx, cy, cr * 1.08, 0, Math.PI * 2);
          bumpCtx.stroke();
          bumpCtx.fillStyle = '#181818';
          bumpCtx.beginPath();
          bumpCtx.arc(cx, cy, cr * 0.85, 0, Math.PI * 2);
          bumpCtx.fill();
        }

        // 4. Branching Incandescent Magma Veins & Lava Fissures across the surface
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        bumpCtx.lineCap = 'round';
        for (let v = 0; v < 22; v++) {
          let vx = (v * 97 + 15) % 512;
          let vy = (v * 149 + 25) % 512;
          const segments = 6;
          const pts = [[vx, vy]];
          for (let s = 1; s <= segments; s++) {
            vx += Math.cos(v * 1.7 + s * 1.1) * 44;
            vy += Math.sin(v * 2.3 - s * 0.9) * 44;
            pts.push([vx, vy]);
          }

          const strokePath = (targetCtx) => {
            targetCtx.beginPath();
            pts.forEach(([px, py], idx) => {
              if (idx === 0) targetCtx.moveTo(px, py);
              else targetCtx.lineTo(px, py);
            });
            targetCtx.stroke();
          };

          // Outer crimson heat halo
          ctx.strokeStyle = 'rgba(220, 38, 38, 0.75)';
          ctx.lineWidth = 14;
          strokePath(ctx);

          // Mid blazing orange magma river
          ctx.strokeStyle = '#f97316';
          ctx.lineWidth = 8;
          strokePath(ctx);

          // Inner white-hot yellow-gold core fissure
          ctx.strokeStyle = '#fef08a';
          ctx.lineWidth = 3.2;
          strokePath(ctx);

          // Deep fissure groove in bump map
          bumpCtx.strokeStyle = '#101010';
          bumpCtx.lineWidth = 9;
          strokePath(bumpCtx);
        }
      }

      const pair = { map: mapTex, bumpMap: bumpTex };
      textureCache[key] = pair;
      return pair;
    }

      const mKey = `anime_mat_v3_${type}_${colorHex}_${detailHex}_${repeatX}_${repeatY}_${opacity}`;
      if (materialCache[mKey]) return materialCache[mKey];

      const { map, bumpMap } = getProceduralTextures(type, colorHex, detailHex, repeatX, repeatY);
      const isWin = type === 'window';
      const effectiveBump = isWin ? 0 : (bumpScale || (type === 'grass' || type === 'studs' ? 0.14 : 0.10));

      const winEmissiveCol = currentMapIndex === 2 ? new THREE.Color(0x06b6d4) : new THREE.Color(0xf59e0b);
      const mat = new THREE.MeshStandardMaterial({
        map,
        bumpMap: null,
        roughness: isWin ? 0.12 : (type === 'roof' ? 0.55 : 0.75),
        metalness: isWin ? 0.85 : 0.04,
        emissive: isWin ? winEmissiveCol : (colorHex === 0xfacc15 || colorHex === 0x06b6d4 ? new THREE.Color(colorHex) : new THREE.Color(0x000000)),
        emissiveIntensity: isWin ? 0.38 : (colorHex === 0xfacc15 || colorHex === 0x06b6d4 ? 0.65 : 0.0),
        transparent: opacity < 1,

      });

      applyShadowRichShader(mat, type);
      materialCache[mKey] = mat;
      return mat;

      crown.position.set(0, 0.86, 0);

      // 9. Soft Ambient-Occlusion Ground Contact Shadow Disc

      const aoShadow = new THREE.Mesh(aoShadowGeo, getContactShadowMaterial());
      aoShadow.position.y = 0.04;

      return {
        root, head, torso, leftArm, rightArm, leftLeg, rightLeg,

    // =========================================================================
    // 5. EXPANDED MAPS (RADIUS 86), TEXTURED BUILDINGS, ROADS, LAMPS & VEHICLES
    // =========================================================================
    let destructibleBlocks = [];
    let terrainHills = [];
    let buildingHealth = {};
    let hidingSpots = [];
    let activeVehicles = [];
    let activeStudents = [];
    let splashRings = [];

    function clearGroup(group) {
      while (group.children.length > 0) {
        group.remove(group.children[0]);
      }
    }

    const ISLAND_OUTER_LIMIT_SQ = (ISLAND_RADIUS + 4) * (ISLAND_RADIUS + 4);
    function getTerrainHeightAt(x, z) {
      if (x * x + z * z > ISLAND_OUTER_LIMIT_SQ) return -2.2;
      let h = 0.22;
      for (let i = 0, len = terrainHills.length; i < len; i++) {
        const hill = terrainHills[i];
        const dx = x - hill.x;
        const dz = z - hill.z;
        const dSq = dx * dx + dz * dz;
        if (dSq < hill.r * hill.r) {
          const d = Math.sqrt(dSq);
          const factor = Math.min(1, (hill.r - d) / (hill.r * 0.36));
          const cand = 0.22 + hill.h * factor;
          if (cand > h) h = cand;
        }
      }
      return h;
    }

    function addTerrainHill(x, z, radius, height, topColor, sideColor) {
      terrainHills.push({ x, z, r: radius, h: height });
      // Smooth 48-segment rounded anime meadow hill
      const hillGeo = new THREE.CylinderGeometry(radius * 0.74, radius, height, 48);
      const grassKey = `grass_${currentMapIndex}`;
      const hillMat = getTexturedMaterial(grassKey, topColor, sideColor, Math.max(2, Math.round(radius / 4.2)), Math.max(2, Math.round(radius / 4.2)), 1, 0.15);
      const mesh = new THREE.Mesh(hillGeo, hillMat);
      mesh.position.set(x, height / 2, z);
      mesh.receiveShadow = true;
      mesh.castShadow = true;
      mapGroup.add(mesh);

      const rockGeo = new THREE.CylinderGeometry(radius * 0.85, radius * 1.03, height * 0.56, 36);
      const rockMat = getTexturedMaterial('rock', sideColor, 0x1e293b, 4, 2, 1, 0);
      const rock = new THREE.Mesh(rockGeo, rockMat);
      rock.position.set(x, height * 0.27, z);
      rock.receiveShadow = true;
      rock.castShadow = true;
      mapGroup.add(rock);
    }

    function addRockCluster(x, z, scale = 1, color = 0x64748b) {
      const baseH = getTerrainHeightAt(x, z);
      const mat = getTexturedMaterial('rock', color, 0x1e293b, 2, 2, 1, 0);
      for (let i = 0; i < 4; i++) {
        const r = (1.3 + Math.random() * 1.6) * scale;
        const rock = new THREE.Mesh(new THREE.IcosahedronGeometry(r, 1), mat);
        rock.scale.set(1.15, 0.78, 1.05);
        rock.position.set(x + (Math.random() - 0.5) * 3.4, baseH + r * 0.42, z + (Math.random() - 0.5) * 3.4);
        rock.rotation.set(0, Math.random() * Math.PI, 0);
        rock.castShadow = true;
        rock.receiveShadow = true;
        mapGroup.add(rock);
      }
    }

      const y0 = getTerrainHeightAt(x, z);
      const poleMat = getTexturedMaterial('concrete', 0x334155, 0x0f172a, 1, 2);

    function addBlock(w, h, d, x, y, z, color, buildingId, isRoof = false, opacity = 1, isFloorSlab = false, texType = 'brick', shapeType = 'box') {
      let geo;
      if (shapeType === 'foliage') {
        geo = new THREE.IcosahedronGeometry(w * 0.54, 2);
        geo.scale(1.0, h / Math.max(w, 0.1), d / Math.max(w, 0.1));
        if (geo.computeVertexNormals) geo.computeVertexNormals();
      } else if (shapeType === 'pyramid') {
        // Open-ended 4-sided pitched hip roof (no hidden bottom cap to Z-fight or self-shadow against the roof slab!)
        geo = new THREE.ConeGeometry(0.72, 1.0, 4, 1, true);
        if (geo.rotateY) geo.rotateY(Math.PI / 4);
        geo.scale(w, h, d);
        if (geo.computeVertexNormals) geo.computeVertexNormals();
      } else if (shapeType === 'cone') {
        geo = new THREE.ConeGeometry(w * 0.58, h, 14);
      } else if (shapeType === 'cylinder') {
        geo = new THREE.CylinderGeometry(w * 0.42, w * 0.52, h, 12);
      } else {
        geo = new THREE.BoxGeometry(w, h, d);
      }

      const effectiveTex = opacity < 1 ? 'window' : (isRoof ? 'roof' : (isFloorSlab ? 'concrete' : texType));
      const repX = isRoof ? Math.max(2, Math.round(Math.max(w, d) / 3.2)) : Math.max(1, Math.round(Math.max(w, d) / 5));
      const repY = isRoof ? Math.max(2, Math.round(Math.max(h, d) / 3.2)) : Math.max(1, Math.round(h / 4));
      const mat = getTexturedMaterial(effectiveTex, color, 0x334155, repX, repY, opacity, isRoof ? 0.18 : 0.12);

      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(x, y, z);
      mesh.castShadow = opacity === 1 && !isFloorSlab;
      mesh.receiveShadow = opacity === 1;
      destructibleGroup.add(mesh);

      if (!buildingHealth[buildingId]) {
        buildingHealth[buildingId] = { total: 0, broken: 0, panicked: false };
      }
      buildingHealth[buildingId].total++;

      const block = {
        mesh,
        w, h, d,
        buildingId,
        isRoof,
        isFloorSlab,
        detached: false,
        vx: 0, vy: 0, vz: 0,
        rx: 0, ry: 0, rz: 0
      };
      destructibleBlocks.push(block);
      return block;
    }

    function buildShelterStructure(cfg) {
      const {
        id, cx, cz, w, d, floors = 2, floorH = 4.6,
        wallColor = 0xfef08a, roofColor = 0xdc2626, pillarColor = 0xe2e8f0,
        glass = false
      } = cfg;

      const groundY = getTerrainHeightAt(cx, cz) - 0.2;
      const mapWallTex = currentMapIndex === 0 ? 'japanese_wall' : (currentMapIndex === 1 ? 'med_wall' : 'tech_wall');

      // 1. Layered Foundation & Entrance Steps
      addBlock(w + 1.8, 0.55, d + 1.8, cx, groundY + 0.25, cz, pillarColor, id, false, 1, true, 'concrete');
      addBlock(5.0, 0.25, 1.4, cx, groundY + 0.12, cz + (d / 2) + 1.2, pillarColor, id, false, 1, true, 'concrete');
      addBlock(4.2, 0.25, 1.0, cx, groundY + 0.35, cz + (d / 2) + 0.7, pillarColor, id, false, 1, true, 'concrete');

      for (let f = 0; f < floors; f++) {
        const yBase = groundY + f * floorH;
        const slabH = 0.46;
        if (f > 0) {
          // Overhanging Architectural Floor Slab with Balcony Railings
          const slabExtra = currentMapIndex === 0 ? 2.2 : (currentMapIndex === 1 ? 1.9 : 1.4);
          const slabCol = currentMapIndex === 0 ? roofColor : pillarColor;
          const slabTex = currentMapIndex === 0 ? 'roof' : (currentMapIndex === 2 ? 'tech_wall' : 'concrete');
          addBlock(w + slabExtra, slabH, d + slabExtra, cx, yBase + slabH * 0.5, cz, slabCol, id, false, 1, true, slabTex);

          // Cantilevered Balcony Railings
          const railH = 0.82;
          const railCol = currentMapIndex === 0 ? 0x991b1b : (currentMapIndex === 1 ? 0x1e293b : 0x0284c7);
          const railTex = currentMapIndex === 2 ? 'window' : 'concrete';
          addBlock(w + slabExtra - 0.4, railH, 0.22, cx, yBase + slabH + railH * 0.5, cz + (d + slabExtra) * 0.5 - 0.12, railCol, id, false, 0.9, false, railTex);
          addBlock(0.22, railH, d + slabExtra - 0.4, cx - (w + slabExtra) * 0.5 + 0.12, yBase + slabH + railH * 0.5, cz, railCol, id, false, 0.9, false, railTex);
          addBlock(0.22, railH, d + slabExtra - 0.4, cx + (w + slabExtra) * 0.5 - 0.12, yBase + slabH + railH * 0.5, cz, railCol, id, false, 0.9, false, railTex);

          // Map 2: Glowing Cyan Neon Trim along Floor Slabs
          if (currentMapIndex === 2) {
            addBlock(w + slabExtra + 0.1, 0.18, 0.18, cx, yBase + slabH * 0.5, cz + (d + slabExtra) * 0.5 + 0.08, 0x06b6d4, id, false, 0.95, false, 'window');
            addBlock(w + slabExtra + 0.1, 0.18, 0.18, cx, yBase + slabH * 0.5, cz - (d + slabExtra) * 0.5 - 0.08, 0x06b6d4, id, false, 0.95, false, 'window');
          }
        }

        const hw = w / 2 - 0.55;
        const hd = d / 2 - 0.55;
        const pSize = currentMapIndex === 2 ? 1.5 : 1.25;
        const pCol = currentMapIndex === 2 ? 0x0f172a : pillarColor;
        const innerFloorH = floorH - slabH;
        const innerBaseY = yBase + slabH;

        // 4 Architectural Corner Pilasters with Base & Top Trim
        [[-hw, -hd], [hw, -hd], [-hw, hd], [hw, hd]].forEach(([px, pz]) => {
          addBlock(pSize, innerFloorH, pSize, cx + px, innerBaseY + innerFloorH * 0.5, cz + pz, pCol, id, false, 1, false, 'concrete');
          addBlock(pSize + 0.32, 0.26, pSize + 0.32, cx + px, innerBaseY + 0.13, cz + pz, pCol, id, false, 1, false, 'concrete');
          addBlock(pSize + 0.32, 0.26, pSize + 0.32, cx + px, innerBaseY + innerFloorH - 0.13, cz + pz, pCol, id, false, 1, false, 'concrete');
        });

        // Lower Architectural Walls fitting cleanly BETWEEN pillars
        const spanW = Math.max(2.0, w - 1.1 - pSize);
        const spanD = Math.max(2.0, d - 1.1 - pSize);
        const lowH = innerFloorH * 0.52;
        const lowY = innerBaseY + lowH * 0.5;
        addBlock(spanW, lowH, 0.72, cx, lowY, cz - hd, wallColor, id, false, 1, false, mapWallTex);
        addBlock(0.72, lowH, spanD, cx - hw, lowY, cz, wallColor, id, false, 1, false, mapWallTex);
        addBlock(0.72, lowH, spanD, cx + hw, lowY, cz, wallColor, id, false, 1, false, mapWallTex);

        if (f === 0) {
          // Grand Framed Entrance with Portico Awning & Columns
          const wingW = Math.max(1.4, (spanW - 3.8) * 0.5);
          addBlock(wingW, lowH, 0.72, cx - spanW * 0.5 + wingW * 0.5, lowY, cz + hd, wallColor, id, false, 1, false, mapWallTex);
          addBlock(wingW, lowH, 0.72, cx + spanW * 0.5 - wingW * 0.5, lowY, cz + hd, wallColor, id, false, 1, false, mapWallTex);

          const canopyY = innerBaseY + lowH + 0.22;
          addBlock(5.2, 0.44, 2.2, cx, canopyY, cz + hd + 1.4, roofColor, id, true, 1, false, 'roof');
          addBlock(0.5, lowH, 0.5, cx - 2.1, innerBaseY + lowH * 0.5, cz + hd + 2.1, pillarColor, id, false, 1, false, 'concrete', 'cylinder');
          addBlock(0.5, lowH, 0.5, cx + 2.1, innerBaseY + lowH * 0.5, cz + hd + 2.1, pillarColor, id, false, 1, false, 'concrete', 'cylinder');
          addBlock(0.65, 0.65, 0.65, cx, canopyY - 0.45, cz + hd + 0.8, 0xfacc15, id, false, 0.95, false, 'window');
        } else {
          addBlock(spanW, lowH, 0.72, cx, lowY, cz + hd, wallColor, id, false, 1, false, mapWallTex);
        }

        // Upper Window Gallery with Structural Mullions & Warm Glowing Panes
        const upH = innerFloorH * 0.48;
        const upY = innerBaseY + lowH + upH * 0.5;
        addBlock(spanW, upH, 0.54, cx, upY, cz - hd, 0x38bdf8, id, false, 1, false, 'window');
        addBlock(spanW, upH, 0.54, cx, upY, cz + hd, 0x38bdf8, id, false, 1, false, 'window');
        addBlock(0.54, upH, spanD, cx - hw, upY, cz, 0x38bdf8, id, false, 1, false, 'window');
        addBlock(0.54, upH, spanD, cx + hw, upY, cz, 0x38bdf8, id, false, 1, false, 'window');

        // Central Window Cross-Frame Mullions
        addBlock(0.32, upH, 0.62, cx, upY, cz - hd, 0x1e293b, id, false, 1, false, 'concrete');
        addBlock(0.32, upH, 0.62, cx, upY, cz + hd, 0x1e293b, id, false, 1, false, 'concrete');

        // Hiding spots
        const cols = Math.max(2, Math.floor(w / 4.2));
        const rows = Math.max(2, Math.floor(d / 4.2));

    // Select 38 well-separated hiding spots (1 student per shelter/building first!) so students never bunch up!
    function allocateNonCrowdedHidingSpots(count) {
      const byBuilding = {};
      hidingSpots.forEach(sp => {
        if (!byBuilding[sp.buildingId]) byBuilding[sp.buildingId] = [];
        byBuilding[sp.buildingId].push(sp);
      });

      const buildingKeys = Object.keys(byBuilding).sort(() => Math.random() - 0.5);
      buildingKeys.forEach(k => {
        byBuilding[k].sort(() => Math.random() - 0.5);
      });

      const chosen = [];
      for (const bKey of buildingKeys) {
        if (chosen.length >= count) break;
        const candidate = byBuilding[bKey].find(sp =>
          chosen.every(c => Math.hypot(sp.x - c.x, sp.z - c.z) >= 9.0)
        ) || byBuilding[bKey][0];
        if (candidate) chosen.push(candidate);
      }

      const remaining = hidingSpots
        .filter(sp => !chosen.includes(sp))
        .sort(() => Math.random() - 0.5);

      for (const sp of remaining) {
        if (chosen.length >= count) break;
        if (chosen.every(c => Math.hypot(sp.x - c.x, sp.z - c.z) >= 6.2 || Math.abs(sp.y - c.y) >= 3.5)) {
          chosen.push(sp);
        }
      }
      while (chosen.length < count && remaining.length > 0) {
        chosen.push(remaining.pop());
      }
      return chosen;
    }

    function spawnAllStudents() {
      clearGroup(studentsGroup);
      activeStudents = [];

      const eligible = playersData.filter(p => !p.excluded);
      const assignedSpots = allocateNonCrowdedHidingSpots(eligible.length);

      // Arrange the 38 students in a clean 4-row curved amphitheater formation on the front plaza
      // facing the camera so every single student's face, uniform, and badge is clearly visible!
      const rowCounts = [8, 9, 10, 11]; // 8 + 9 + 10 + 11 = 38
      const rowRadii = [6.2, 8.8, 11.4, 14.0];

      eligible.forEach((p, idx) => {
        const model = buildStudentMesh(p);

        let rIdx = 0;
        let slotIdx = idx;
        while (rIdx < rowCounts.length - 1 && slotIdx >= rowCounts[rIdx]) {
          slotIdx -= rowCounts[rIdx];
          rIdx++;
        }
        const countInRow = rowCounts[rIdx];
        const radius = rowRadii[rIdx];
        const t = countInRow > 1 ? slotIdx / (countInRow - 1) : 0.5;
        const arcSpan = Math.PI * 1.28;
        const angle = (t - 0.5) * arcSpan + (rIdx % 2 === 1 ? 0.04 : -0.04);

        const sx = Math.sin(angle) * radius;
        const sz = Math.cos(angle) * radius * 0.78 + 2.2;
        const sy = getTerrainHeightAt(sx, sz);

        const startY = sy + 1.2 + (rIdx * 0.25);
        model.root.position.set(sx, startY, sz);
        model.root.rotation.y = Math.atan2(-sx, 28 - sz) * 0.55;
        model.aoShadow.position.set(sx, sy + 0.05, sz);
        studentsGroup.add(model.root);

        const targetSpot = assignedSpots[idx] || {
          x: (Math.random() - 0.5) * 90,
          y: 0.25,
          z: (Math.random() - 0.5) * 90,
          buildingId: 'plaza_' + idx,
          roofTier: 1
        };

        activeStudents.push({
          data: p,
          model,
          alive: true,
          badgeState: 'normal',
          panicking: false,
          panicTimer: 0,
          x: sx,
          y: startY,
          z: sz,
          vy: 0,
          onGround: false,
          targetSpot,
          runSpeed: 12.2 + Math.random() * 3.8,
          animPhase: Math.random() * Math.PI * 2,
          flung: false,
          vx: 0,
          vz: 0,
          spinX: 0,
          spinY: 0,
          inVortex: false,
          vortexAngle: Math.random() * Math.PI * 2,
          vortexHeight: 0,
          splashed: false
        });
      });

      updateCountersUI();
    }

    function triggerShelterPanic(buildingId, hazardX, hazardZ) {
      if (!buildingId || buildingId.startsWith('tree_')) return;
      const health = buildingHealth[buildingId];
      if (health) {
        health.broken++;
      }

      let anyPanicked = false;
      activeStudents.forEach(st => {
        if (!st.alive || st.flung) return;
        if (st === designatedWinner) return;

        const inThisBuilding = st.targetSpot && st.targetSpot.buildingId === buildingId;
        const nearHazard = Math.hypot(st.x - hazardX, st.z - hazardZ) < 18.0;

        if (inThisBuilding || nearHazard) {
          st.panicking = true;
          st.panicTimer = 3.5 + Math.random() * 2.5;
          setStudentBadgeMode(st, 'panic');
          setStudentFace(st, 'scared');

          if (st.onGround) {
            st.vy = 10.0 + Math.random() * 4.5;
            st.onGround = false;
          }

          const awayAngle = Math.atan2(st.z - hazardZ, st.x - hazardX) + (Math.random() - 0.5) * 1.4;
          const runDist = 18 + Math.random() * 22;
          const nx = THREE.MathUtils.clamp(st.x + Math.cos(awayAngle) * runDist, -68, 68);
          const nz = THREE.MathUtils.clamp(st.z + Math.sin(awayAngle) * runDist, -68, 68);
          const ny = getTerrainHeightAt(nx, nz);

          st.targetSpot = {
            x: nx,
            y: ny,
            z: nz,
            buildingId: 'scatter_' + Math.floor(Math.random() * 999),
            roofTier: 1
          };
          anyPanicked = true;
        }
      });

      if (anyPanicked && Math.random() < 0.45) {
        SFX.playPanic();
      }
    }

    function spawnAcidStrikeAt(x, y, z, radius = 11.5) {
      SFX.playBoom(0.65);
      screenShake = Math.min(screenShake + 0.7, 1.6);

      const waveGeo = new THREE.RingGeometry(0.8, 3.0, 24);
      waveGeo.rotateX(-Math.PI / 2);
      const waveMat = new THREE.MeshBasicMaterial({ color: 0xa3e635, side: THREE.DoubleSide, transparent: true, opacity: 0.92 });
      const wave = new THREE.Mesh(waveGeo, waveMat);
      wave.position.set(x, y + 0.35, z);
      fxGroup.add(wave);

      if (disasterObj) {
        disasterObj.rings.push({ mesh: wave, scale: 1, alpha: 0.92 });

        const splashGeo = new THREE.BoxGeometry(0.55, 0.55, 0.55);
        for (let i = 0; i < 14; i++) {
          const spMat = new THREE.MeshBasicMaterial({ color: i % 2 === 0 ? 0xa3e635 : 0x4ade80 });
          const sp = new THREE.Mesh(splashGeo, spMat);
          sp.position.set(x, y + 1.0, z);
          fxGroup.add(sp);
          const ang = Math.random() * Math.PI * 2;
          const spd = 7 + Math.random() * 13;
          disasterObj.embers.push({
            mesh: sp,
            vx: Math.cos(ang) * spd,
            vy: 10 + Math.random() * 12,
            vz: Math.sin(ang) * spd,
            life: 0.9 + Math.random() * 0.5
          });
        }
      }

      const corrodedBuildings = new Set();
      destructibleBlocks.forEach(b => {
        if (b.detached) return;
        if (b.buildingId === designatedWinner?.targetSpot?.buildingId && b.isFloorSlab) return;
        const dx = b.mesh.position.x - x;
        const dy = b.mesh.position.y - y;
        const dz = b.mesh.position.z - z;
        const dist = Math.sqrt(dx * dx + dy * dy + dz * dz);
        if (dist < radius) {
          if (!b.acidCorroded && b.mesh) {
            b.mesh.material = getTexturedMaterial('studs', 0x65a30d, 0x365314, 2, 2);
            b.acidCorroded = true;
          }
          b.detached = true;
          b.life = 3.0;
          corrodedBuildings.add(b.buildingId);
          const push = (1 - dist / radius) * 16 + 6;
          b.vx = (dx / (dist || 1)) * push + (Math.random() - 0.5) * 14;
          b.vy = 10 + Math.random() * 14;
          b.vz = (dz / (dist || 1)) * push + (Math.random() - 0.5) * 14;
          b.rx = (Math.random() - 0.5) * 9;
          b.ry = (Math.random() - 0.5) * 9;
          b.rz = (Math.random() - 0.5) * 9;
        }
      });

      corrodedBuildings.forEach(bId => triggerShelterPanic(bId, x, z));
      triggerShelterPanic('nearby', x, z);
    }

    function spawn3DLightningBolt(x, z) {
      if (disasterObj.lightning) {
        fxGroup.remove(disasterObj.lightning);
      }
      const boltGroup = new THREE.Group();
      const boltMat = new THREE.LineBasicMaterial({ color: 0xfef08a });
      const coreBoltMat = new THREE.LineBasicMaterial({ color: 0xffffff });
      const branchMat = new THREE.LineBasicMaterial({ color: 0x38bdf8 });

      const points = [];
      const corePoints = [];
      let currX = x;
      let currZ = z;
      for (let y = 60; y >= 0; y -= 3.2) {
        const pt = new THREE.Vector3(currX, y, currZ);
        points.push(pt);
        corePoints.push(new THREE.Vector3(currX + 0.35, y, currZ + 0.35));
        if (y > 10 && y < 52 && Math.random() < 0.48) {
          const bPts = [pt.clone()];
          let bx = currX;
          let bz = currZ;
          for (let by = y - 3; by >= Math.max(3, y - 18); by -= 3) {
            bx += (Math.random() - 0.5) * 7.5;
            bz += (Math.random() - 0.5) * 7.5;
            bPts.push(new THREE.Vector3(bx, by, bz));
          }
          boltGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(bPts), branchMat));
        }
        currX += (Math.random() - 0.5) * 4.8;
        currZ += (Math.random() - 0.5) * 4.8;
      }
      boltGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(points), boltMat));
      boltGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(corePoints), coreBoltMat));

      const strikeRingGeo = new THREE.RingGeometry(1.0, 6.8, 24);
      strikeRingGeo.rotateX(-Math.PI / 2);
      const strikeRing = new THREE.Mesh(strikeRingGeo, new THREE.MeshBasicMaterial({ color: 0x38bdf8, side: THREE.DoubleSide, transparent: true, opacity: 0.92 }));
      strikeRing.position.set(currX, getTerrainHeightAt(currX, currZ) + 0.32, currZ);
      boltGroup.add(strikeRing);

      fxGroup.add(boltGroup);
      disasterObj.lightning = boltGroup;
      disasterObj.lightningTimer = 0.18;
    }

    function spawnMeteor(tx, ty, tz) {
      const ringGroup = new THREE.Group();
      const outerGeo = new THREE.RingGeometry(4.8, 6.6, 28);
      outerGeo.rotateX(-Math.PI / 2);
      const innerGeo = new THREE.RingGeometry(1.5, 2.8, 24);
      innerGeo.rotateX(-Math.PI / 2);
      const ringMat = new THREE.MeshBasicMaterial({ color: 0xef4444, side: THREE.DoubleSide, transparent: true, opacity: 0.94 });
      const innerMat = new THREE.MeshBasicMaterial({ color: 0xfacc15, side: THREE.DoubleSide, transparent: true, opacity: 0.94 });
      ringGroup.add(new THREE.Mesh(outerGeo, ringMat));
      ringGroup.add(new THREE.Mesh(innerGeo, innerMat));

      const laserGeo = new THREE.CylinderGeometry(0.22, 0.85, 55, 12);
      const laserMat = new THREE.MeshBasicMaterial({ color: 0xef4444, transparent: true, opacity: 0.35 });
      const laser = new THREE.Mesh(laserGeo, laserMat);
      laser.position.y = 27.5;
      ringGroup.add(laser);

      ringGroup.position.set(tx, ty + 0.35, tz);
      fxGroup.add(ringGroup);

      const mGroup = new THREE.Group();
      const rockSpinGroup = new THREE.Group();
      const meteorMat = getMeteorMaterial();

      // 1. Main Craggy Textured Asteroid Body (Magma Veins + Charred Basalt Plates)
      const coreGeo = new THREE.IcosahedronGeometry(3.45, 2);
      coreGeo.scale(1.14, 0.92, 1.05);
      const core = new THREE.Mesh(coreGeo, meteorMat);
      core.castShadow = true;
      rockSpinGroup.add(core);

      // 2. Asymmetric Protruding Volcanic Rock Nodules for an Organic Craggy Asteroid Silhouette
      const noduleOffsets = [
        [2.1, 0.8, 1.1, 1.45],
        [-2.2, -0.7, 1.2, 1.35],
        [0.6, 2.0, -1.4, 1.25],
        [-1.3, -1.8, -1.5, 1.40],
        [1.5, -1.4, -1.6, 1.20]
      ];
      noduleOffsets.forEach(([nx, ny, nz, nr], idx) => {
        const nodGeo = new THREE.DodecahedronGeometry(nr, 1);
        const nod = new THREE.Mesh(nodGeo, meteorMat);
        nod.position.set(nx, ny, nz);
        nod.rotation.set(idx * 1.1, idx * 0.7, idx * 1.5);
        rockSpinGroup.add(nod);
      });

      // 3. Incandescent Inner Magma Aura Halo (Softly hugs the rock fissures, no ugly wireframe cage!)
      const auraMat = new THREE.MeshBasicMaterial({
        color: 0xf97316,
        transparent: true,
        opacity: 0.32
      });
      const aura = new THREE.Mesh(new THREE.IcosahedronGeometry(3.92, 2), auraMat);
      rockSpinGroup.add(aura);
      mGroup.add(rockSpinGroup);

      // 4. Directional Atmospheric Entry Plasma Shock-Cone & Blazing Comet Tail
      const tailGroup = new THREE.Group();
      const outerTailGeo = new THREE.ConeGeometry(3.85, 14.5, 16, 1, true);
      if (outerTailGeo.translate) outerTailGeo.translate(0, 7.25, 0);
      const outerTailMat = new THREE.MeshBasicMaterial({
        color: 0xea580c,
        transparent: true,
        opacity: 0.56,
        side: THREE.DoubleSide,
        depthWrite: false
      });
      const outerTail = new THREE.Mesh(outerTailGeo, outerTailMat);
      tailGroup.add(outerTail);

      const innerTailGeo = new THREE.ConeGeometry(2.35, 9.8, 14);
      if (innerTailGeo.translate) innerTailGeo.translate(0, 4.9, 0);
      const innerTailMat = new THREE.MeshBasicMaterial({
        color: 0xfef08a,
        transparent: true,
        opacity: 0.78,
        depthWrite: false
      });
      const innerTail = new THREE.Mesh(innerTailGeo, innerTailMat);
      tailGroup.add(innerTail);

      const startX = tx + (Math.random() - 0.5) * 44;
      const startY = 88 + Math.random() * 20;
      const startZ = tz - 36;

      // Align the fiery comet tail opposite to the velocity direction
      const dirVec = new THREE.Vector3(startX - tx, startY - ty, startZ - tz).normalize();
      if (tailGroup.quaternion && tailGroup.quaternion.setFromUnitVectors) {
        tailGroup.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dirVec);
      }
      mGroup.add(tailGroup);

      mGroup.position.set(startX, startY, startZ);
      fxGroup.add(mGroup);

      disasterObj.meteors.push({
        mesh: mGroup,
        rockSpinGroup,
        tailGroup,
        ring: ringGroup,
        sx: startX, sy: startY, sz: startZ,
        tx, ty, tz,
        progress: 0,
        speed: 1.28 + Math.random() * 0.38
      });
    }

    function triggerExplosionAt(x, y, z, radius = 14.5) {
      SFX.playBoom(1.0);
      screenShake = Math.min(screenShake + 1.5, 2.8);

      const flashEl = document.getElementById('screen-flash');
      flashEl.style.opacity = '0.32';
      setTimeout(() => { flashEl.style.opacity = '0'; }, 90);

      waveGeo.rotateX(-Math.PI / 2);

      const wave = new THREE.Mesh(waveGeo, waveMat);
      wave.position.set(x, y + 0.5, z);
      fxGroup.add(wave);
      if (disasterObj) {
        disasterObj.rings.push({ mesh: wave, scale: 1, alpha: 0.95 });

        const fbGeo = new THREE.SphereGeometry(2.8, 16, 16);

        const fb = new THREE.Mesh(fbGeo, fbMat);
        fb.position.set(x, y + 1.5, z);
        fxGroup.add(fb);
        disasterObj.fireballs.push({ mesh: fb, scale: 1, alpha: 0.92 });

        const mushGroup = new THREE.Group();
        const stem = new THREE.Mesh(
          new THREE.CylinderGeometry(1.2, 2.2, 5.5, 10),
          new THREE.MeshBasicMaterial({ color: 0xea580c, transparent: true, opacity: 0.85 })
        );
        stem.position.y = 2.75;
        mushGroup.add(stem);
        const cap = new THREE.Mesh(
          new THREE.DodecahedronGeometry(3.8, 1),
          new THREE.MeshBasicMaterial({ color: 0x334155, transparent: true, opacity: 0.88 })
        );
        cap.position.y = 6.2;
        mushGroup.add(cap);
        mushGroup.position.set(x, y, z);
        fxGroup.add(mushGroup);
        disasterObj.mushrooms.push({ mesh: mushGroup, vy: 8.5, scale: 0.7, alpha: 0.9 });

        if (disasterObj.craters.length < 18) {
          const craterGeo = new THREE.CircleGeometry(4.8, 24);
          craterGeo.rotateX(-Math.PI / 2);
          const crater = new THREE.Mesh(craterGeo, getCraterMaterial());
          crater.position.set(x, getTerrainHeightAt(x, z) + 0.15, z);
          crater.rotation.y = Math.random() * Math.PI * 2;
          fxGroup.add(crater);
          disasterObj.craters.push(crater);
        }

        const emberGeo = new THREE.BoxGeometry(0.75, 0.75, 0.75);
        for (let i = 0; i < 18; i++) {
          const emMat = new THREE.MeshBasicMaterial({ color: i % 2 === 0 ? 0xf97316 : 0xfef08a });
          const em = new THREE.Mesh(emberGeo, emMat);
          em.position.set(x, y + 1.2, z);
          fxGroup.add(em);
          const ang = Math.random() * Math.PI * 2;
          const spd = 10 + Math.random() * 18;
          disasterObj.embers.push({
            mesh: em,
            vx: Math.cos(ang) * spd,
            vy: 14 + Math.random() * 17,
            vz: Math.sin(ang) * spd,
            life: 1.3 + Math.random() * 0.6
          });
        }
      }

      const damagedBuildings = new Set();
      destructibleBlocks.forEach(b => {
        if (b.detached) return;
        if (b.buildingId === designatedWinner?.targetSpot?.buildingId && b.isFloorSlab) return;

        const dx = b.mesh.position.x - x;
        const dy = b.mesh.position.y - y;
        const dz = b.mesh.position.z - z;
        const dist = Math.sqrt(dx * dx + dy * dy + dz * dz);
        if (dist < radius) {
          b.detached = true;
          damagedBuildings.add(b.buildingId);
          const push = (1 - dist / radius) * 22 + 7;
          b.vx = (dx / (dist || 1)) * push + (Math.random() - 0.5) * 9;
          b.vy = 12 + Math.random() * 15;
          b.vz = (dz / (dist || 1)) * push + (Math.random() - 0.5) * 9;
          b.rx = (Math.random() - 0.5) * 9;
          b.ry = (Math.random() - 0.5) * 9;
          b.rz = (Math.random() - 0.5) * 9;
        }
      });

      damagedBuildings.forEach(bId => triggerShelterPanic(bId, x, z));
      triggerShelterPanic('nearby', x, z);

      activeVehicles.forEach(v => {
        if (v.detached) return;
        const dx = v.x - x;
        const dz = v.z - z;
        const dist = Math.hypot(dx, dz);
        if (dist < radius * 1.3) {
          v.detached = true;
          v.vx = (dx / (dist || 1)) * 18 + (Math.random() - 0.5) * 8;
          v.vy = 15 + Math.random() * 12;
          v.vz = (dz / (dist || 1)) * 18 + (Math.random() - 0.5) * 8;
          v.rx = (Math.random() - 0.5) * 6;
          v.ry = (Math.random() - 0.5) * 6;
          v.rz = (Math.random() - 0.5) * 6;
        }
      });
    }

    function spawnEliminationPoof(x, y, z, disType) {
      if (!disasterObj) return;
      const ringColor = disType === 0 ? 0x38bdf8 : (disType === 1 ? 0xa3e635 : 0xf97316);
      const ringGeo = new THREE.RingGeometry(0.5, 2.2, 20);
      ringGeo.rotateX(-Math.PI / 2);

      const ring = new THREE.Mesh(ringGeo, ringMat);
      ring.position.set(x, Math.max(0.4, getTerrainHeightAt(x, z) + 0.25), z);
      fxGroup.add(ring);
      disasterObj.rings.push({ mesh: ring, scale: 1, alpha: 0.92 });

      const puffGeo = new THREE.IcosahedronGeometry(0.48, 1);
      for (let i = 0; i < 10; i++) {
        const pCol = i % 2 === 0 ? 0xffffff : ringColor;
        const pMesh = new THREE.Mesh(puffGeo, new THREE.MeshBasicMaterial({ color: pCol, transparent: true, opacity: 0.9 }));
        pMesh.position.set(x, y + 1.4, z);
        fxGroup.add(pMesh);
        const ang = (i / 10) * Math.PI * 2;
        const spd = 5 + Math.random() * 7;
        disasterObj.embers.push({
          mesh: pMesh,
          vx: Math.cos(ang) * spd,
          vy: 6 + Math.random() * 8,
          vz: Math.sin(ang) * spd,
          life: 0.42 + Math.random() * 0.2
        });
      }
    }

    function eliminateStudent(st, disType) {
      if (!st.alive) return;
      st.alive = false;
      st.flung = false;
      st.onGround = false;
      SFX.playOof();

      pushEliminationFeed(st.data, disType);

      if (disType === 0) {
        triggerShelterPanic(st.targetSpot?.buildingId, st.x, st.z);
      } else if (disType === 1) {
        spawnAcidStrikeAt(st.x, st.y, st.z, 10.5);
        triggerShelterPanic(st.targetSpot?.buildingId, st.x, st.z);
      } else {
        triggerExplosionAt(st.x, st.y, st.z, 12.5);
      }

      spawnEliminationPoof(st.x, st.y, st.z, disType);

      // Immediately remove the eliminated student's 3D model and contact shadow so they disappear!
      if (st.model) {
        if (st.model.root) {
          st.model.root.visible = false;
          studentsGroup.remove(st.model.root);
        }
        if (st.model.aoShadow) {
          st.model.aoShadow.visible = false;
          studentsGroup.remove(st.model.aoShadow);
        }
      }

      updateCountersUI();
    }

    function pushEliminationFeed(player, disType) {
      const feed = document.getElementById('elim-feed');
      const item = document.createElement('div');
      const disIcons = ['🌪️', '🧪', '☄️'];
      const gIcon = player.gender === 'M' ? '👦' : '👧';
      item.className = 'flex items-center gap-1.5 px-2.5 py-1 rounded-xl bg-slate-900/80 border border-rose-500/60 text-xs font-extrabold text-white shadow pop-in';
      item.innerHTML = `<span>${disIcons[disType]}</span><span>${gIcon}</span><span class="text-rose-300">${player.name}</span>`;
      feed.prepend(item);
      while (feed.children.length > 5) {
        feed.removeChild(feed.lastChild);
      }
    }
