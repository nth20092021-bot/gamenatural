    function resetSkyAndLighting() {
      const theme = MAP_SHADER_THEMES[currentMapIndex] || MAP_SHADER_THEMES[0];
      skyUniforms.uTopColor.value.setHex(theme.skyTop);
      skyUniforms.uMidColor.value.setHex(theme.skyMid);
      skyUniforms.uHorizonColor.value.setHex(theme.skyHorizon);
      skyUniforms.uStorminess.value = 0.0;
      oceanUniforms.uDeepColor.value.setHex(theme.oceanDeep);
      oceanUniforms.uShallowColor.value.setHex(theme.oceanShallow);
      oceanUniforms.uSkyReflectColor.value.setHex(theme.oceanReflect);
      oceanUniforms.uFoamColor.value.setHex(theme.oceanFoam);
      if (oceanUniforms.uFogColor && oceanUniforms.uFogColor.value.setHex) {
        oceanUniforms.uFogColor.value.setHex(theme.fogColor);
      }
      if (scene.fog && scene.fog.color && scene.fog.color.setHex) scene.fog.color.setHex(theme.fogColor);
      if (scene.background && scene.background.setHex) scene.background.setHex(theme.bgColor);
      if (dirLight.color && dirLight.color.setHex) dirLight.color.setHex(theme.dirColor);
      dirLight.intensity = theme.dirIntensity;
      if (hemiLight.color && hemiLight.color.setHex) hemiLight.color.setHex(theme.hemiSky);
      if (hemiLight.groundColor && hemiLight.groundColor.setHex) hemiLight.groundColor.setHex(theme.hemiGround);
      hemiLight.intensity = theme.hemiIntensity;
      if (mapShaderUniforms.uShadowTint.value.setRGB) mapShaderUniforms.uShadowTint.value.setRGB(theme.shadowTint[0], theme.shadowTint[1], theme.shadowTint[2]);
      if (mapShaderUniforms.uLitTint.value.setRGB) mapShaderUniforms.uLitTint.value.setRGB(theme.litTint[0], theme.litTint[1], theme.litTint[2]);
      if (mapShaderUniforms.uRimColor.value.setRGB) mapShaderUniforms.uRimColor.value.setRGB(theme.rimColor[0], theme.rimColor[1], theme.rimColor[2]);
      if (theme.sunPos) {
        if (mapShaderUniforms.uMapSunDir.value.set) {
          const sd = mapShaderUniforms.uMapSunDir.value.set(theme.sunPos[0], theme.sunPos[1], theme.sunPos[2]);
          if (sd && sd.normalize) sd.normalize();
        }
        if (skyUniforms.uSunDir && skyUniforms.uSunDir.value.set) {
          const s1 = skyUniforms.uSunDir.value.set(theme.sunPos[0], theme.sunPos[1], theme.sunPos[2]);
          if (s1 && s1.normalize) s1.normalize();
        }
        if (oceanUniforms.uSunDir && oceanUniforms.uSunDir.value.set) {
          const s2 = oceanUniforms.uSunDir.value.set(theme.sunPos[0], theme.sunPos[1], theme.sunPos[2]);
          if (s2 && s2.normalize) s2.normalize();
        }
        if (dirLight.position && dirLight.position.set) {
          dirLight.position.set(theme.sunPos[0], theme.sunPos[1], theme.sunPos[2]);
        }
      }
      oceanMesh.position.y = -1.8;
    }

    function startNewRound() {
      SFX.playClick();
      document.getElementById('winner-overlay').classList.add('hidden');
      document.getElementById('winner-overlay').classList.remove('flex');
      document.getElementById('elim-feed').innerHTML = '';
      confettiParticles = [];

      resetSkyAndLighting();
      document.getElementById('danger-vignette').style.opacity = '0';

      if (selectedMapMode === 'random') {
        currentMapIndex = Math.floor(Math.random() * 3);
      } else {
        currentMapIndex = Number(selectedMapMode);
      }
      buildMap(currentMapIndex);
      spawnAllStudents();

      if (activeStudents.length === 0) {
        playersData.forEach(p => { p.excluded = false; });
        spawnAllStudents();
      }

      if (selectedDisMode === 'random') {
        currentDisIndex = Math.floor(Math.random() * 3);
      } else {
        currentDisIndex = Number(selectedDisMode);
      }

      const winIdx = Math.floor(Math.random() * activeStudents.length);
      designatedWinner = activeStudents[winIdx];

      const sturdySpots = hidingSpots.filter(s => s.roofTier >= 2);
      if (sturdySpots.length > 0) {
        designatedWinner.targetSpot = sturdySpots[Math.floor(Math.random() * sturdySpots.length)];
      }

      gameState = STATE.HIDING;
      phaseTimer = 0;
      stateDuration = 7.0;
      spectateId = null;
      userZoomFactor = 1.0;
      // GSAP Skills: Cinematic camera sweep down to student plaza
      if (typeof gsap !== 'undefined') {
        gsap.killTweensOf(camera.position);
        gsap.fromTo(camera.position,
          { x: 0, y: 38, z: 62 },
          { x: 0, y: 12.5, z: 27, duration: 2.4, ease: 'power2.out' }
        );
      }

      showPhaseBanner('🏃', '🏠', 'border-emerald-400');
      updateStartButtonUI();
    }

    function enterWarningPhase() {
      gameState = STATE.WARNING;
      phaseTimer = 0;
      stateDuration = 2.1;
      SFX.playSiren();
      document.getElementById('danger-vignette').style.opacity = '0.65';
      // GSAP Skills: Sudden focal length tension punch
      if (typeof gsap !== 'undefined') {
        gsap.to(camera, {
          fov: 44,
          duration: 0.35,
          yoyo: true,
          repeat: 1,
          ease: 'power2.inOut',
          onUpdate: () => camera.updateProjectionMatrix()
        });
      }
      const disIcons = ['🌪️', '🧪', '☄️'];
      showPhaseBanner('⚠️', disIcons[currentDisIndex], 'border-amber-400 animate-danger');
    }

    function enterDisasterPhase() {
      gameState = STATE.DISASTER;
      phaseTimer = 0;
      stateDuration = 15.2;

      const disIcons = ['🌪️', '🧪', '☄️'];
      showPhaseBanner(disIcons[currentDisIndex], '⚡', 'border-rose-500 animate-danger');

      const losers = activeStudents.filter(s => s !== designatedWinner);
      losers.sort((a, b) => (a.targetSpot.roofTier - b.targetSpot.roofTier) + (Math.random() - 0.5) * 1.2);

      eliminationSchedule = losers.map((st, idx) => {
        const progress = (idx + 0.4) / Math.max(losers.length, 1);
        const triggerTime = 1.2 + Math.pow(progress, 0.92) * 13.0;
        return { student: st, time: triggerTime, done: false };
      });

      activeStudents.forEach(st => setStudentFace(st, 'scared'));
      initDisasterVisuals(currentDisIndex);
    }

    function applyVictoryXRayWalls() {
      const winBuildingId = designatedWinner?.targetSpot?.buildingId;
      const winY = designatedWinner ? designatedWinner.y : 0;

      if (!materialCache.xrayFloor) {
        materialCache.xrayFloor = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, transparent: true, opacity: 0.52, depthWrite: true, roughness: 0.5 });
        materialCache.xraySame = new THREE.MeshStandardMaterial({ color: 0x93c5fd, transparent: true, opacity: 0.16, depthWrite: false, roughness: 0.35 });
        materialCache.xrayOther = new THREE.MeshStandardMaterial({ color: 0xcbd5e1, transparent: true, opacity: 0.24, depthWrite: false, roughness: 0.45 });
      }

      destructibleBlocks.forEach(b => {
        if (b.detached || !b.mesh) return;
        if (b.buildingId && b.buildingId.startsWith('tree_')) return;

        const isSameBuilding = winBuildingId && b.buildingId === winBuildingId;
        const isSupportingFloor = isSameBuilding && b.isFloorSlab && !b.isRoof && Math.abs(b.mesh.position.y - winY) < 1.2;

        if (isSupportingFloor) {
          b.mesh.material = materialCache.xrayFloor;
        } else {
          b.mesh.material = isSameBuilding ? materialCache.xraySame : materialCache.xrayOther;
          b.mesh.castShadow = false;
        }
      });
    }

    function enterVictoryPhase() {
      gameState = STATE.VICTORY;
      phaseTimer = 0;
      SFX.playVictory();

      document.getElementById('phase-banner').classList.add('hidden');
      document.getElementById('danger-vignette').style.opacity = '0';

      resetSkyAndLighting();
      dirLight.color.setHex(0xfef08a);
      dirLight.intensity = 1.2;
      clearGroup(fxGroup);

      if (designatedWinner) {
        lastEliminatedWinnerId = designatedWinner.data.id;
        designatedWinner.alive = true;
        designatedWinner.flung = false;
        designatedWinner.inVortex = false;
        designatedWinner.panicking = false;
        setStudentFace(designatedWinner, 'win');
        setStudentBadgeMode(designatedWinner, 'sheltered');
        designatedWinner.model.crown.visible = true;
        applyVictoryXRayWalls();
        designatedWinner.model.root.rotation.set(0, 0, 0);
        // GSAP Skills: Smooth cinematic zoom-in focus onto designated winner
        if (typeof gsap !== 'undefined') {
          const targetX = designatedWinner.x + 9 * Math.cos(orbitAngle);
          const targetY = designatedWinner.y + 4.2;
          const targetZ = designatedWinner.z + 9 * Math.sin(orbitAngle);
          gsap.to(camera.position, {
            x: targetX,
            y: targetY,
            z: targetZ,
            duration: 1.8,
            ease: 'power3.out'
          });
        }

        const confColors = [0xfacc15, 0xf43f5e, 0x38bdf8, 0x4ade80, 0xa855f7];
        const confGeo = new THREE.BoxGeometry(0.35, 0.35, 0.08);
        for (let i = 0; i < 95; i++) {
          const mat = new THREE.MeshBasicMaterial({ color: confColors[i % confColors.length] });
          const m = new THREE.Mesh(confGeo, mat);
          m.position.set(
            designatedWinner.x + (Math.random() - 0.5) * 12,
            designatedWinner.y + 5 + Math.random() * 12,
            designatedWinner.z + (Math.random() - 0.5) * 12
          );
          fxGroup.add(m);
          confettiParticles.push({
            mesh: m,
            vy: 2.5 + Math.random() * 3.5,
            rx: (Math.random() - 0.5) * 8,
            ry: (Math.random() - 0.5) * 8
          });
        }

        const disIcons = ['🌪️', '🧪', '☄️'];
        document.getElementById('win-gender-icon').textContent = designatedWinner.data.gender === 'M' ? '👦' : '👧';
        document.getElementById('win-disaster-icon').textContent = disIcons[currentDisIndex];
        document.getElementById('win-number').textContent = `#${designatedWinner.data.numStr}`;
        document.getElementById('win-name').textContent =
          designatedWinner.data.name !== `#${designatedWinner.data.numStr}` ? designatedWinner.data.name : '';
        document.getElementById('exclude-label').textContent = `🚫 #${designatedWinner.data.numStr}`;

        const overlay = document.getElementById('winner-overlay');
        overlay.classList.remove('hidden');
        overlay.classList.add('flex');
      }

      updateCountersUI();
      updateStartButtonUI();
    }

    function showPhaseBanner(iconLeft, iconRight, borderClasses) {
      const banner = document.getElementById('phase-banner');
      const pill = document.getElementById('phase-pill');
      banner.classList.remove('hidden');
      banner.classList.add('flex');
      pill.className = `flex items-center gap-2.5 px-5 py-2 rounded-2xl bg-slate-900/90 backdrop-blur-md border-2 shadow-2xl ${borderClasses}`;
      document.getElementById('phase-icon').textContent = iconLeft;
      document.getElementById('phase-subicon').textContent = iconRight;
      document.getElementById('phase-bar').style.width = '100%';
    }

    // =========================================================================
    // 9. MAIN ANIMATION, SHADER UNIFORMS, GRAVITY & PHYSICS LOOP
    // =========================================================================
    let lastTime = performance.now();
    let orbitAngle = 0.4;

    function animate(now) {
      requestAnimationFrame(animate);
      const rawDt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;
      const dt = rawDt * (gameState === STATE.IDLE || gameState === STATE.VICTORY ? 1 : speedMultiplier);

      // Update GLSL Sky & Ocean Shader Uniforms
      skyUniforms.uTime.value = now * 0.001;
      oceanUniforms.uTime.value = now * 0.001;
      oceanUniforms.uCameraPos.value.copy(camera.position);

      oceanMesh.position.y = (gameState === STATE.DISASTER && currentDisIndex === 1 && disasterObj)
        ? disasterObj.floodY
        : -1.8;

      if (gameState === STATE.HIDING) {
        phaseTimer += dt;
        const pct = Math.max(0, 100 - (phaseTimer / stateDuration) * 100);
        document.getElementById('phase-bar').style.width = `${pct}%`;
        if (phaseTimer >= stateDuration) {
          enterWarningPhase();
        }
      } else if (gameState === STATE.WARNING) {
        phaseTimer += dt;
        const pct = Math.max(0, 100 - (phaseTimer / stateDuration) * 100);
        document.getElementById('phase-bar').style.width = `${pct}%`;
        const disIcons = ['🌪️', '🧪', '☄️'];
        if (selectedDisMode === 'random' && phaseTimer < 1.2) {
          document.getElementById('phase-subicon').textContent = disIcons[Math.floor(phaseTimer * 12) % 3];
        } else {
          document.getElementById('phase-subicon').textContent = disIcons[currentDisIndex];
        }
        if (phaseTimer >= stateDuration) {
          enterDisasterPhase();
        }
      } else if (gameState === STATE.DISASTER) {
        phaseTimer += dt;
        const pct = Math.max(0, 100 - (phaseTimer / stateDuration) * 100);
        document.getElementById('phase-bar').style.width = `${pct}%`;

        eliminationSchedule.forEach(item => {
          if (!item.done && phaseTimer >= item.time) {
            item.done = true;
            if (currentDisIndex === 0 && disasterObj && disasterObj.funnel) {
              disasterObj.tx = item.student.x;
              disasterObj.tz = item.student.z;
            } else if (currentDisIndex === 2) {
              spawnMeteor(item.student.x, item.student.y, item.student.z);
            }
            eliminateStudent(item.student, currentDisIndex);
          }
        });

        updateDisasterSimulation(dt, now);

        if (phaseTimer >= stateDuration) {
          enterVictoryPhase();
        }
      } else if (gameState === STATE.VICTORY) {
        phaseTimer += dt;
        confettiParticles.forEach(c => {
          c.mesh.position.y -= c.vy * dt;
          c.mesh.rotation.x += c.rx * dt;
          c.mesh.rotation.y += c.ry * dt;
          if (c.mesh.position.y < designatedWinner.y) {
            c.mesh.position.y = designatedWinner.y + 12 + Math.random() * 5;
          }
        });
      }

      destructibleBlocks.forEach(b => {
        if (!b.detached || b.removed) return;
        if (b.life === undefined) b.life = 3.0;
        b.life -= dt;
        if (b.life <= 0) {
          b.removed = true;
          b.mesh.visible = false;
          destructibleGroup.remove(b.mesh);
          return;
        }
        b.vy += GRAVITY * dt;
        b.mesh.position.x += b.vx * dt;
        b.mesh.position.y += b.vy * dt;
        b.mesh.position.z += b.vz * dt;

        // Prevent blocks from ever clipping through the ground, with chaotic bounce scatter!
        const halfExtent = Math.max(0.45, Math.min(b.w || 1, b.h || 1, b.d || 1) * 0.5);
        const minGroundY = Math.max(0.24, getTerrainHeightAt(b.mesh.position.x, b.mesh.position.z)) + halfExtent;
        if (b.mesh.position.y < minGroundY) {
          b.mesh.position.y = minGroundY;
          if (b.vy < -3.0) {
            b.vy = Math.abs(b.vy) * 0.48;
            b.vx = b.vx * 0.78 + (Math.random() - 0.5) * 4.5;
            b.vz = b.vz * 0.78 + (Math.random() - 0.5) * 4.5;
            b.rx = (Math.random() - 0.5) * 8;
            b.rz = (Math.random() - 0.5) * 8;
          } else {
            b.vy = 0;
            b.vx *= 0.82;
            b.vz *= 0.82;
            b.rx *= 0.75;
            b.ry *= 0.75;
            b.rz *= 0.75;
          }
        }

        b.mesh.rotation.x += b.rx * dt;
        b.mesh.rotation.y += b.ry * dt;
        b.mesh.rotation.z += b.rz * dt;

        // Keep full size for 2.55s while flying & bouncing, then smoothly shrink out in final 0.45s (total 3.0s)
        const sFactor = b.life < 0.45 ? Math.max(0.01, b.life / 0.45) : 1.0;
        b.mesh.scale.setScalar(sFactor);
      });

      activeVehicles.forEach(v => {
        if (!v.detached || v.removed) return;
        if (v.life === undefined) v.life = 3.0;
        v.life -= dt;
        if (v.life <= 0) {
          v.removed = true;
          v.mesh.visible = false;
          vehiclesGroup.remove(v.mesh);
          return;
        }
        v.vy += GRAVITY * 0.9 * dt;
        v.x += v.vx * dt;
        v.y += v.vy * dt;
        v.z += v.vz * dt;

        // Prevent vehicles from ever clipping through the ground!
        const minGroundY = Math.max(0.24, getTerrainHeightAt(v.x, v.z)) + 0.95;
        if (v.y < minGroundY) {
          v.y = minGroundY;
          if (v.vy < -3.0) {
            v.vy = Math.abs(v.vy) * 0.45;
            v.vx = v.vx * 0.78 + (Math.random() - 0.5) * 3.5;
            v.vz = v.vz * 0.78 + (Math.random() - 0.5) * 3.5;
          } else {
            v.vy = 0;
            v.vx *= 0.82;
            v.vz *= 0.82;
            v.rx *= 0.75;
            v.ry *= 0.75;
            v.rz *= 0.75;
          }
        }

        v.mesh.position.set(v.x, v.y, v.z);
        v.mesh.rotation.x += v.rx * dt;
        v.mesh.rotation.y += v.ry * dt;
        v.mesh.rotation.z += v.rz * dt;
        const vScale = v.life < 0.45 ? Math.max(0.01, v.life / 0.45) : 1.0;
        v.mesh.scale.setScalar(vScale);
      });

      for (let i = splashRings.length - 1; i >= 0; i--) {
        const sr = splashRings[i];
        sr.scale += 6.5 * dt;
        sr.alpha -= 1.4 * dt;
        sr.mesh.scale.setScalar(sr.scale);
        sr.mesh.material.opacity = Math.max(0, sr.alpha);
        if (sr.alpha <= 0) {
          fxGroup.remove(sr.mesh);
          splashRings.splice(i, 1);
        }
      }

      updateStudentsAnimation(dt, now);
      updateCamera(rawDt, now);

      if (composer) {
        composer.render();
      } else {
        renderer.render(scene, camera);
      }
    }

    function updateDisasterSimulation(dt, now) {
      if (!disasterObj) return;

      for (let i = disasterObj.embers.length - 1; i >= 0; i--) {
        const em = disasterObj.embers[i];
        em.vy += GRAVITY * dt;
        em.mesh.position.x += em.vx * dt;
        em.mesh.position.y += em.vy * dt;
        em.mesh.position.z += em.vz * dt;
        const emGroundY = Math.max(0.22, getTerrainHeightAt(em.mesh.position.x, em.mesh.position.z)) + 0.38;
        if (em.mesh.position.y < emGroundY) {
          em.mesh.position.y = emGroundY;
          em.vy = Math.abs(em.vy) * 0.38;
          em.vx *= 0.75;
          em.vz *= 0.75;
        }
        em.mesh.rotation.x += 8 * dt;
        em.mesh.rotation.y += 8 * dt;
        em.life -= dt;
        em.mesh.scale.setScalar(Math.max(0.05, em.life));
        if (em.life <= 0) {
          fxGroup.remove(em.mesh);
          disasterObj.embers.splice(i, 1);
        }
      }

      if (disasterObj.mushrooms) {
        for (let i = disasterObj.mushrooms.length - 1; i >= 0; i--) {
          const mc = disasterObj.mushrooms[i];
          mc.mesh.position.y += mc.vy * dt;
          mc.scale += 1.6 * dt;
          mc.alpha -= 0.75 * dt;
          mc.mesh.scale.setScalar(mc.scale);
          mc.mesh.children.forEach(ch => { ch.material.opacity = Math.max(0, mc.alpha); });
          if (mc.alpha <= 0) {
            fxGroup.remove(mc.mesh);
            disasterObj.mushrooms.splice(i, 1);
          }
        }
      }

      if (disasterObj.subFunnels) {
        disasterObj.subFunnels.forEach(sf => {
          sf.angle += sf.speed * dt;
          sf.group.position.set(Math.cos(sf.angle) * sf.radius, 0, Math.sin(sf.angle) * sf.radius);
          sf.group.rotation.y += 8 * dt;
        });
      }
      if (disasterObj.windStreaks) {
        disasterObj.windStreaks.forEach(ws => {
          ws.mesh.position.x += ws.speed * dt;
          if (ws.mesh.position.x > 130) ws.mesh.position.x = -130;
        });
      }

      if (disasterObj.whirlpools) {
        disasterObj.whirlpools.forEach(wp => {
          wp.position.y = disasterObj.floodY + 0.25;
          wp.rotation.y += 4.5 * dt;
        });
      }

      for (let i = disasterObj.fireballs.length - 1; i >= 0; i--) {
        const fb = disasterObj.fireballs[i];
        fb.scale += 14 * dt;
        fb.alpha -= 2.2 * dt;
        fb.mesh.scale.setScalar(fb.scale);
        fb.mesh.material.opacity = Math.max(0, fb.alpha);
        if (fb.alpha <= 0) {
          fxGroup.remove(fb.mesh);
          disasterObj.fireballs.splice(i, 1);
        }
      }

      if (disasterObj.ribbons) {
        disasterObj.ribbons.forEach(rb => {
          rb.mesh.rotation.z += rb.speed * dt;
        });
      }

      for (let i = disasterObj.rings.length - 1; i >= 0; i--) {
        const r = disasterObj.rings[i];
        r.scale += 18 * dt;
        r.alpha -= 1.65 * dt;
        r.mesh.scale.setScalar(r.scale);
        r.mesh.material.opacity = Math.max(0, r.alpha);
        if (r.alpha <= 0) {
          fxGroup.remove(r.mesh);
          disasterObj.rings.splice(i, 1);
        }
      }

      if (disasterObj.type === 0 && disasterObj.funnel) {
        const f = disasterObj.funnel;
        f.position.x += (disasterObj.tx - f.position.x) * Math.min(1, dt * 4.2);
        f.position.z += (disasterObj.tz - f.position.z) * Math.min(1, dt * 4.2);

        disasterObj.rainDrops.forEach(drop => {
          drop.position.y -= 48 * dt;
          drop.position.x -= 12 * dt;
          if (drop.position.y < Math.max(0.3, getTerrainHeightAt(drop.position.x, drop.position.z) + 0.6)) {
            drop.position.y = 56;
            drop.position.x = (Math.random() - 0.5) * 220;
          }
        });

        if (disasterObj.lightning) {
          disasterObj.lightningTimer -= dt;
          if (disasterObj.lightningTimer <= 0) {
            fxGroup.remove(disasterObj.lightning);
            disasterObj.lightning = null;
          }
        }

        disasterObj.parts.forEach(p => {
          if (p.isDebris) {
            p.ang += p.speed * dt;
            p.mesh.position.x = Math.cos(p.ang) * p.rad;
            p.mesh.position.z = Math.sin(p.ang) * p.rad;
            p.mesh.rotation.x += 5 * dt;
            p.mesh.rotation.y += 6 * dt;
          } else {
            p.mesh.rotation.z += p.speed * dt;
            p.mesh.position.x = Math.sin(now * 0.009 + p.offset) * 1.25;
            p.mesh.position.z = Math.cos(now * 0.009 + p.offset) * 1.25;
          }
        });

        const hitBuildings = new Set();
        destructibleBlocks.forEach(b => {
          if (b.detached) return;
          if (b.buildingId === designatedWinner?.targetSpot?.buildingId && b.isFloorSlab) return;
          const dx = b.mesh.position.x - f.position.x;
          const dz = b.mesh.position.z - f.position.z;
          const dist = Math.sqrt(dx * dx + dz * dz);
          if (dist < 15.5 && Math.random() < 0.28) {
            b.detached = true;
            hitBuildings.add(b.buildingId);
            b.vx = -dz * 2.1 + (Math.random() - 0.5) * 11;
            b.vy = 16 + Math.random() * 14;
            b.vz = dx * 2.1 + (Math.random() - 0.5) * 11;
            b.rx = 5; b.ry = 6; b.rz = 4;
          }
        });
        hitBuildings.forEach(bId => triggerShelterPanic(bId, f.position.x, f.position.z));

        activeVehicles.forEach(v => {
          if (v.detached) return;
          const dist = Math.hypot(v.x - f.position.x, v.z - f.position.z);
          if (dist < 15.5) {
            v.detached = true;
            v.vx = (Math.random() - 0.5) * 18;
            v.vy = 18 + Math.random() * 12;
            v.vz = (Math.random() - 0.5) * 18;
            v.rx = 4; v.ry = 5; v.rz = 3;
          }
        });

        if (Math.random() < 0.048) {
          SFX.playBoom(0.75);
          screenShake = Math.min(screenShake + 0.9, 1.9);
          spawn3DLightningBolt(f.position.x + (Math.random() - 0.5) * 34, f.position.z + (Math.random() - 0.5) * 34);
          const flashEl = document.getElementById('screen-flash');
          flashEl.style.opacity = '0.38';
          setTimeout(() => { flashEl.style.opacity = '0'; }, 75);
        }

      } else if (disasterObj.type === 1) {
        // 🧪 ACID RAIN SIMULATION: Falling Acid Streaks + Expanding Acid Puddles + Rising Toxic Bubbles + Roof/Building Corrosion
        disasterObj.acidClouds.forEach(ac => {
          ac.mesh.position.x = ac.baseX + Math.sin(now * 0.0012 + ac.phase) * 6.5;
          ac.mesh.rotation.y += 0.15 * dt;
        });

        disasterObj.acidDrops.forEach(d => {
          d.mesh.position.y -= d.speed * dt;
          d.mesh.position.x -= 4.5 * dt;
          if (d.mesh.position.y < Math.max(0.3, getTerrainHeightAt(d.mesh.position.x, d.mesh.position.z) + 0.6)) {
            d.mesh.position.y = 56 + Math.random() * 6;
            d.mesh.position.x = (Math.random() - 0.5) * 235;
            d.mesh.position.z = (Math.random() - 0.5) * 235;
          }
        });

        const progressRatio = Math.min(1, phaseTimer / Math.max(stateDuration, 1));
        disasterObj.acidPuddles.forEach(p => {
          const s = p.baseScale * (0.65 + progressRatio * 0.85 + Math.sin(now * 0.008 + p.phase) * 0.12);
          p.mesh.scale.setScalar(s);
        });

        disasterObj.acidBubbles.forEach(b => {
          b.mesh.position.y += b.speed * dt;
          b.mesh.position.x = b.baseX + Math.sin(now * 0.006 + b.phase) * 0.85;
          b.mesh.position.z = b.baseZ + Math.cos(now * 0.006 + b.phase) * 0.85;
          if (b.mesh.position.y > b.baseY + 8.5) {
            b.mesh.position.y = b.baseY;
          }
        });

        // Continuous Acid Corrosion on Roofs, Upper Walls, and Trees across the island
        if (destructibleBlocks.length > 0 && Math.random() < 0.45) {
          const hitBuildings = new Set();
          for (let k = 0; k < 4; k++) {
            const b = destructibleBlocks[Math.floor(Math.random() * destructibleBlocks.length)];
            if (!b || b.detached) continue;
            if (b.buildingId === designatedWinner?.targetSpot?.buildingId && b.isFloorSlab) continue;

            if (!b.acidCorroded && b.mesh) {
              b.mesh.material = getTexturedMaterial('studs', 0x65a30d, 0x365314, 2, 2);
              b.acidCorroded = true;
            } else if (b.isRoof || Math.random() < 0.48) {
              b.detached = true;
              b.life = 3.0;
              hitBuildings.add(b.buildingId);
              b.vx = (Math.random() - 0.5) * 18;
              b.vy = 9 + Math.random() * 12;
              b.vz = (Math.random() - 0.5) * 18;
              b.rx = (Math.random() - 0.5) * 8;
              b.ry = (Math.random() - 0.5) * 8;
              b.rz = (Math.random() - 0.5) * 8;
            }
          }
          hitBuildings.forEach(bId => triggerShelterPanic(bId, 0, 0));
        }

        // Occasional heavy acid downpour burst on random map spot
        if (Math.random() < 0.08) {
          const ax = (Math.random() - 0.5) * 155;
          const az = (Math.random() - 0.5) * 155;
          spawnAcidStrikeAt(ax, getTerrainHeightAt(ax, az), az, 9.5);
        }

      } else if (disasterObj.type === 2) {
        if (Math.random() < 0.2) {
          const rx = (Math.random() - 0.5) * 112;
          const rz = (Math.random() - 0.5) * 112;
          spawnMeteor(rx, getTerrainHeightAt(rx, rz), rz);
        }

        for (let i = disasterObj.meteors.length - 1; i >= 0; i--) {
          const m = disasterObj.meteors[i];
          m.progress += m.speed * dt;
          m.mesh.position.x = THREE.MathUtils.lerp(m.sx, m.tx, m.progress);
          m.mesh.position.y = THREE.MathUtils.lerp(m.sy, m.ty, m.progress);
          m.mesh.position.z = THREE.MathUtils.lerp(m.sz, m.tz, m.progress);
          if (m.rockSpinGroup) {
            m.rockSpinGroup.rotation.x += 6.5 * dt;
            m.rockSpinGroup.rotation.y += 8.2 * dt;
          }
          if (m.tailGroup) {
            const flicker = 0.88 + Math.sin(now * 0.045 + i) * 0.16;
            m.tailGroup.scale.set(1.0, flicker, 1.0);
          }
          m.ring.scale.setScalar(1 + Math.sin(now * 0.025) * 0.18);

          if (Math.random() < 0.78) {
            // Rounded anime magma fire & dark volcanic ash smoke puffs (no boxy cubes!)
            const isFire = Math.random() > 0.35;
            const trailGeo = new THREE.IcosahedronGeometry(isFire ? 1.15 : 1.45, 1);
            const trailMat = new THREE.MeshBasicMaterial({
              color: isFire ? (Math.random() > 0.45 ? 0xf97316 : 0xfef08a) : 0x292524,
              transparent: true,
              opacity: isFire ? 0.86 : 0.68
            });
            const tr = new THREE.Mesh(trailGeo, trailMat);
            tr.position.set(
              m.mesh.position.x + (Math.random() - 0.5) * 1.8,
              m.mesh.position.y + (Math.random() - 0.5) * 1.8,
              m.mesh.position.z + (Math.random() - 0.5) * 1.8
            );
            fxGroup.add(tr);
            disasterObj.embers.push({
              mesh: tr,
              vx: (Math.random() - 0.5) * 4.5,
              vy: 3.5 + Math.random() * 4.5,
              vz: (Math.random() - 0.5) * 4.5,
              life: 0.52
            });
          }

          if (m.progress >= 1) {
            triggerExplosionAt(m.tx, m.ty, m.tz, 11.5);
            fxGroup.remove(m.mesh);
            fxGroup.remove(m.ring);
            disasterObj.meteors.splice(i, 1);
          }
        }
      }
    }

    function updateStudentsAnimation(dt, now) {
      activeStudents.forEach(st => {
        if (!st.alive) return;
        if (st.model.propellerMesh) {
          st.model.propellerMesh.rotation.y += 14.0 * dt;
        }
        if (st.flung) {
          if (st.inVortex && disasterObj && disasterObj.funnel) {
            st.vortexAngle += 8.8 * dt;
            st.vortexHeight += 12.0 * dt;
            const rad = 2.6 + (st.vortexHeight / 30) * 10.5;
            st.x = disasterObj.funnel.position.x + Math.cos(st.vortexAngle) * rad;
            st.y = st.vortexHeight;
            st.z = disasterObj.funnel.position.z + Math.sin(st.vortexAngle) * rad;
            st.model.root.position.set(st.x, st.y, st.z);
            st.model.root.rotation.y += 10 * dt;
            st.model.root.rotation.z += 6 * dt;
          } else {
            st.vy += GRAVITY * dt;
            st.x += st.vx * dt;
            st.y += st.vy * dt;
            st.z += st.vz * dt;

            const groundY = getTerrainHeightAt(st.x, st.z);
            const onIsland = Math.hypot(st.x, st.z) < ISLAND_RADIUS;
            if (onIsland && st.y < groundY && st.vy < 0) {
              st.y = groundY;
              st.vy = Math.abs(st.vy) * 0.42;
              st.vx *= 0.72;
              st.vz *= 0.72;
            } else if (!st.splashed && st.y <= oceanMesh.position.y + 0.5) {
              st.splashed = true;
              spawnWaterSplash(st.x, oceanMesh.position.y, st.z);
            }

            st.model.root.position.set(st.x, st.y, st.z);
            st.model.root.rotation.x += st.spinX * dt;
            st.model.root.rotation.y += st.spinY * dt;
          }
          st.model.aoShadow.visible = false;
          st.model.leftArm.rotation.x = Math.sin(now * 0.032 + st.animPhase) * 2.4;
          st.model.rightArm.rotation.x = -Math.sin(now * 0.032 + st.animPhase) * 2.4;
          return;
        }

        const terrainY = Math.max(0.25, getTerrainHeightAt(st.x, st.z));
        let supportY = terrainY;

        if (gameState === STATE.HIDING || gameState === STATE.WARNING || gameState === STATE.DISASTER) {
          if (st.panicking) {
            st.panicTimer -= dt;
            const dxP = st.targetSpot.x - st.x;
            const dzP = st.targetSpot.z - st.z;
            if (dxP * dxP + dzP * dzP < 4.5 && st.panicTimer > 0) {
              const intactSpots = hidingSpots.filter(sp => {
                const bh = buildingHealth[sp.buildingId];
                return !bh || bh.broken < bh.total * 0.35;
              });
              if (intactSpots.length > 0 && Math.random() < 0.6) {
                st.targetSpot = intactSpots[Math.floor(Math.random() * intactSpots.length)];
                st.panicking = false;
              } else {
                const randAng = Math.random() * Math.PI * 2;
                const nx = THREE.MathUtils.clamp(st.x + Math.cos(randAng) * 20, -68, 68);
                const nz = THREE.MathUtils.clamp(st.z + Math.sin(randAng) * 20, -68, 68);
                st.targetSpot = {
                  x: nx,
                  y: getTerrainHeightAt(nx, nz),
                  z: nz,
                  buildingId: 'panic_run',
                  roofTier: 1
                };
              }
            }
          }

          const dx = st.targetSpot.x - st.x;
          const dz = st.targetSpot.z - st.z;
          const distSq = dx * dx + dz * dz;

          const bHealth = buildingHealth[st.targetSpot.buildingId];
          const shelterCollapsed = bHealth && bHealth.broken > bHealth.total * 0.42;

          if (distSq < 64 && !shelterCollapsed && st.targetSpot.y > terrainY) {
            supportY = st.targetSpot.y;
          } else if (shelterCollapsed && st !== designatedWinner) {
            supportY = terrainY;
            if (!st.panicking) {
              triggerShelterPanic(st.targetSpot.buildingId, st.x, st.z);
            }
          }

          if (distSq > 0.4) {
            const dist = Math.sqrt(distSq);
            const currentSpeed = st.panicking ? st.runSpeed * 1.45 : st.runSpeed;
            const step = Math.min(dist, currentSpeed * dt);
            st.x += (dx / dist) * step;
            st.z += (dz / dist) * step;
            st.model.root.rotation.y = Math.atan2(dx, dz);

            if (st.onGround && (Math.random() < (st.panicking ? 0.065 : 0.022) || supportY > st.y + 0.5)) {
              st.vy = supportY > st.y + 0.5 ? 13.5 : (7.8 + Math.random() * 3.0);
              st.onGround = false;
            }

            const swing = Math.sin(now * (st.panicking ? 0.032 : 0.022) + st.animPhase) * 1.25;
            if (st.panicking) {
              st.model.leftArm.rotation.x = Math.PI + Math.sin(now * 0.035 + st.animPhase) * 0.65;
              st.model.rightArm.rotation.x = Math.PI - Math.sin(now * 0.035 + st.animPhase) * 0.65;
            } else {
              st.model.leftArm.rotation.x = swing;
              st.model.rightArm.rotation.x = -swing;
            }
            st.model.leftLeg.rotation.x = -swing;
            st.model.rightLeg.rotation.x = swing;
          } else {
            if (!st.panicking) {
              setStudentBadgeMode(st, 'sheltered');
            }
            if (gameState === STATE.DISASTER) {
              st.model.leftArm.rotation.x = -2.4 + Math.sin(now * 0.015 + st.animPhase) * 0.25;
              st.model.rightArm.rotation.x = -2.4 + Math.cos(now * 0.015 + st.animPhase) * 0.25;
              st.model.leftLeg.rotation.x = 0;
              st.model.rightLeg.rotation.x = 0;
            } else {
              st.model.leftArm.rotation.x = 0;
              st.model.rightArm.rotation.x = 0;
              st.model.leftLeg.rotation.x = 0;
              st.model.rightLeg.rotation.x = 0;
            }
          }
        } else if (gameState === STATE.VICTORY && st === designatedWinner) {
          supportY = Math.max(terrainY, st.targetSpot?.y || terrainY);
          if (st.onGround) {
            st.vy = 10.5;
            st.onGround = false;
          }
          st.model.leftArm.rotation.x = Math.PI + Math.sin(now * 0.016) * 0.45;
          st.model.rightArm.rotation.x = Math.PI - Math.sin(now * 0.016) * 0.45;
          st.model.leftLeg.rotation.x = Math.sin(now * 0.012) * 0.4;
          st.model.rightLeg.rotation.x = -Math.sin(now * 0.012) * 0.4;
        } else {
          if (st.onGround && Math.random() < 0.006) {
            st.vy = 8.5 + Math.random() * 2.5;
            st.onGround = false;
          }
          st.model.leftArm.rotation.x = Math.sin(now * 0.004 + st.animPhase) * 0.18;
          st.model.rightArm.rotation.x = -Math.sin(now * 0.004 + st.animPhase) * 0.18;
          st.model.leftLeg.rotation.x = 0;
          st.model.rightLeg.rotation.x = 0;
        }

        // Apply Gravity & Floor Collision
        st.vy += GRAVITY * dt;
        st.y += st.vy * dt;
        if (st.y <= supportY) {
          st.y = supportY;
          if (st.vy < -14) {
            st.vy = Math.abs(st.vy) * 0.25;
            st.onGround = false;
          } else {
            st.vy = 0;
            st.onGround = true;
          }
        } else {
          st.onGround = false;
        }

        st.model.root.position.set(st.x, st.y, st.z);

        // Update Dynamic AO Contact Shadow beneath student (hidden at far zoom or upper floors to prevent Z-fighting)
        const camDistSq = camera.position.x * camera.position.x + camera.position.y * camera.position.y + camera.position.z * camera.position.z;
        if (camDistSq > 9500 || supportY > terrainY + 0.2) {
          st.model.aoShadow.visible = false;
        } else {
          const heightAboveFloor = Math.max(0, st.y - supportY);
          const shadowScale = Math.max(0.25, 1.0 - heightAboveFloor * 0.075);
          st.model.aoShadow.visible = true;
          st.model.aoShadow.position.set(st.x, supportY + 0.12, st.z);
          st.model.aoShadow.scale.setScalar(shadowScale);
        }
      });
    }

    const _camTargetVec = new THREE.Vector3();
    function updateCamera(dt, now) {
      if (!isDraggingCam) {
        orbitAngle += dt * (gameState === STATE.VICTORY ? 0.52 : 0.15);
      }
      const baseAngle = gameState === STATE.IDLE ? Math.sin(orbitAngle * 1.4) * 0.42 : orbitAngle;
      const totalAngle = baseAngle + userOrbitOffset + (camRig.angleOffset || 0);

      if (screenShake > 0) {
        screenShake = Math.max(0, screenShake - dt * 2.8);
      }
      // Silky smooth: only apply camera shake during active disaster impact (no jitter at start)
      const sx = screenShake > 0.02 ? (Math.random() - 0.5) * screenShake : 0;
      const sy = screenShake > 0.02 ? (Math.random() - 0.5) * screenShake : 0;

      if (gameState === STATE.VICTORY && designatedWinner) {
        const wx = designatedWinner.x;
        const wy = designatedWinner.y + 2.6;
        const wz = designatedWinner.z;
        const camX = wx + Math.sin(totalAngle) * 11.5 * userZoomFactor;
        const camZ = wz + Math.cos(totalAngle) * 11.5 * userZoomFactor;
        camera.position.lerp(_camTargetVec.set(camX, wy + 3.2, camZ), Math.min(1, dt * 4.5));
        camera.lookAt(wx, wy + 0.6, wz);
        return;
      }

      if (spectateId !== null) {
        const target = activeStudents.find(s => s.data.id === spectateId && s.alive);
        if (target) {
          const tx = target.x + Math.sin(totalAngle) * 16 * userZoomFactor;
          const tz = target.z + Math.cos(totalAngle) * 16 * userZoomFactor;
          camera.position.lerp(_camTargetVec.set(tx + sx, target.y + 8.5 + sy, tz), Math.min(1, dt * 5));
          camera.lookAt(target.x, target.y + 2.2, target.z);
          return;
        }
      }

      if (cameraMode === 0) {
        let baseRad = camRig.radius;
        let baseHeight = camRig.height;
        let lookY = camRig.lookY;

        if (gameState === STATE.HIDING) {
          const t = THREE.MathUtils.clamp(phaseTimer / stateDuration, 0, 1);
          const smoothT = t * t * (3 - 2 * t);
          baseRad = THREE.MathUtils.lerp(camRig.radius, 168, smoothT);
          baseHeight = THREE.MathUtils.lerp(camRig.height, 82, smoothT);
          lookY = THREE.MathUtils.lerp(camRig.lookY, 6.0, smoothT);
        } else if (gameState === STATE.WARNING || gameState === STATE.DISASTER) {
          baseRad = 170;
          baseHeight = 84;
          lookY = 6.0;
        }

        const rad = baseRad * userZoomFactor;
        const tx = Math.sin(totalAngle) * rad;
        const tz = Math.cos(totalAngle) * rad;
        const ty = THREE.MathUtils.clamp((baseHeight + userPitchOffset) * userZoomFactor, 8, 195);
        camera.position.lerp(_camTargetVec.set(tx + sx, ty + sy, tz), Math.min(1, dt * 3.6));
        camera.lookAt(sx, lookY + sy, 0);
      } else if (cameraMode === 1) {
        const rad = 68 * userZoomFactor;
        const tx = Math.sin(totalAngle * 1.3) * rad;
        const tz = Math.cos(totalAngle * 1.3) * rad;
        camera.position.lerp(_camTargetVec.set(tx + sx, 28 * userZoomFactor + sy, tz), Math.min(1, dt * 3.8));
        camera.lookAt(sx, 6 + sy, 0);
      } else {
        camera.position.lerp(_camTargetVec.set(sx, 128 * userZoomFactor + sy, 54 * userZoomFactor), Math.min(1, dt * 4));
        camera.lookAt(0, 0, -2);
      }
    }

        const accIcon = accIcons[(p.id - 1) % 12];
        const genderBtn = document.createElement('button');
        genderBtn.className = `rbx-btn px-1.5 h-7 rounded-lg flex items-center justify-center gap-0.5 text-xs ${
          p.gender === 'M' ? 'bg-sky-600/40 border border-sky-400/50' : 'bg-pink-600/40 border border-pink-400/50'
        }`;
        genderBtn.textContent = `${p.gender === 'M' ? '👦' : '👧'}${accIcon}`;
        genderBtn.title = 'Đổi Nam / Nữ';
        genderBtn.addEventListener('click', () => {
          SFX.playClick();
          p.gender = p.gender === 'M' ? 'F' : 'M';
          if (gameState === STATE.IDLE) spawnAllStudents();
          renderRosterGrid();
        });

        const nameInput = document.createElement('input');
        nameInput.type = 'text';
        nameInput.value = p.name;
        nameInput.maxLength = 10;
        nameInput.className = 'w-16 bg-transparent text-xs font-extrabold text-white focus:outline-none focus:bg-slate-950 px-1 rounded';
        nameInput.addEventListener('change', () => {
          p.name = nameInput.value.trim() || `#${p.numStr}`;
          if (gameState === STATE.IDLE) spawnAllStudents();
        });

        const focusBtn = document.createElement('button');
        focusBtn.className = 'rbx-btn w-6 h-6 rounded-lg bg-slate-700 hover:bg-slate-600 text-xs flex items-center justify-center';
        focusBtn.textContent = p.excluded ? '➕' : '🎥';
        focusBtn.title = p.excluded ? 'Cho vào lại' : 'Theo dõi học sinh này';
        focusBtn.addEventListener('click', () => {
          SFX.playClick();
          if (p.excluded) {
            p.excluded = false;
            if (gameState === STATE.IDLE) spawnAllStudents();
            renderRosterGrid();
          } else {
            spectateId = p.id;
            document.getElementById('roster-modal').classList.add('hidden');
            document.getElementById('roster-modal').classList.remove('flex');
          }
        });

        card.appendChild(genderBtn);
        card.appendChild(nameInput);
        card.appendChild(focusBtn);
        grid.appendChild(card);
      });
    }

    document.getElementById('btn-roster').addEventListener('click', () => {
      SFX.playClick();
      renderRosterGrid();
      const modal = document.getElementById('roster-modal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    });

    document.getElementById('btn-close-roster').addEventListener('click', () => {
      SFX.playClick();
      const modal = document.getElementById('roster-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    });

    document.getElementById('btn-all-mixed').addEventListener('click', () => {
      SFX.playClick();
      playersData.forEach((p, i) => { p.gender = i % 2 === 0 ? 'M' : 'F'; });
      if (gameState === STATE.IDLE) spawnAllStudents();
      renderRosterGrid();
    });

    document.getElementById('btn-all-male').addEventListener('click', () => {
      SFX.playClick();
      playersData.forEach(p => { p.gender = 'M'; });
      if (gameState === STATE.IDLE) spawnAllStudents();
      renderRosterGrid();
    });

    document.getElementById('btn-all-female').addEventListener('click', () => {
      SFX.playClick();
      playersData.forEach(p => { p.gender = 'F'; });
      if (gameState === STATE.IDLE) spawnAllStudents();
      renderRosterGrid();
    });

    document.getElementById('btn-restore-all').addEventListener('click', () => {
      SFX.playClick();
      playersData.forEach(p => { p.excluded = false; });
      if (gameState === STATE.IDLE) spawnAllStudents();
      updateStartButtonUI();
      renderRosterGrid();
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      if (composer) {
        composer.setSize(window.innerWidth, window.innerHeight);
        if (fxaaPass) {
          const pr = renderer.getPixelRatio();
          fxaaPass.material.uniforms['resolution'].value.x = 1 / (window.innerWidth * pr);
          fxaaPass.material.uniforms['resolution'].value.y = 1 / (window.innerHeight * pr);
        }
      }
    });

    let gameBootstrapped = false;
    function bootstrapGame() {
      if (gameBootstrapped) return;
      gameBootstrapped = true;
      buildMap(0);
      spawnAllStudents();
      updateStartButtonUI();
      lastTime = performance.now();
      requestAnimationFrame(animate);
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', bootstrapGame);
      window.addEventListener('load', bootstrapGame);
    } else {
      bootstrapGame();
    }
  </script>
</body>
</html>
